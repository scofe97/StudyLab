# hostPath type 검사 — 성공 케이스 (문서 09-02 §"hostPath의 type 필드")
# DirectoryOrCreate: 경로에 디렉터리가 없으면 빈 디렉터리를 만들어 준다.
# 그래서 노드에 /tmp/hostpath-demo 가 없어도 파드가 정상 기동한다.
apiVersion: v1
kind: Pod
metadata:
  name: hostpath-type-ok
spec:
  volumes:
  - name: demo
    hostPath:
      path: /tmp/hostpath-demo
      type: DirectoryOrCreate    # 없으면 생성 → 검사 통과
  containers:
  - name: app
    image: alpine
    command: ["sleep", "9999999999"]
    volumeMounts:
    - name: demo
      mountPath: /data
