# hostPath 위험 시연 — 노드 루트(/)를 컨테이너 /host 에 통째로 마운트 (문서 09-02 §2)
# 이 파드에 들어가 /host 로 가면 워커 노드의 파일시스템 전체가 보인다.
# 컨테이너가 root 로 돌면 노드의 어떤 파일도 고칠 수 있다 — 그래서 hostPath 는
# 가장 위험한 볼륨 타입이고 보통 특권 파드에만 허용된다.
#
# ⚠️ 학습용 시연. 실제 클러스터에서는 이런 파드를 일반 사용자가 못 만들게 막아야 한다.
apiVersion: v1
kind: Pod
metadata:
  name: node-explorer
spec:
  volumes:
  - name: host-root
    hostPath:
      path: /              # 노드 파일시스템의 루트 디렉터리를 가리킴
  containers:
  - name: node-explorer
    image: alpine
    command: ["sleep", "9999999999"]
    volumeMounts:
    - name: host-root
      mountPath: /host     # 컨테이너 /host 에 노드 루트가 통째로 보임
