apiVersion: v1
kind: Pod
metadata:
  name: secret-nofsgroup           # fsGroup 없음 → 비-root 프로세스가 키를 못 읽는다
spec:
  securityContext:
    runAsUser: 1000                 # root(0)가 아닌 uid 1000 으로 실행
    runAsGroup: 1000                # gid 1000
    # fsGroup 없음 — 볼륨 파일은 root 그룹 소유로 남는다
  volumes:
  - name: secret-vol
    secret:
      secretName: app-secret
      items:
      - key: tls.key
        path: tls.key
        mode: 0640                  # rw-r----- : 소유자·그룹만 읽기, 남은 못 읽음
  containers:
  - name: shell
    image: busybox
    command: ["sleep", "3600"]
    volumeMounts:
    - name: secret-vol
      mountPath: /etc/secret
      readOnly: true
