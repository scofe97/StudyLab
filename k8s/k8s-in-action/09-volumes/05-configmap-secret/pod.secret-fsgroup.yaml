apiVersion: v1
kind: Pod
metadata:
  name: secret-fsgroup             # fsGroup 있음 → 그룹 소유권이 바뀌어 읽힌다
spec:
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 2000                   # ★ 볼륨 파일의 그룹 소유권을 gid 2000 으로 바꾸고
                                    #   프로세스를 2000 그룹의 보충 멤버로 넣는다
  volumes:
  - name: secret-vol
    secret:
      secretName: app-secret
      items:
      - key: tls.key
        path: tls.key
        mode: 0640                  # 위와 동일한 제한 권한
  containers:
  - name: shell
    image: busybox
    command: ["sleep", "3600"]
    volumeMounts:
    - name: secret-vol
      mountPath: /etc/secret
      readOnly: true
