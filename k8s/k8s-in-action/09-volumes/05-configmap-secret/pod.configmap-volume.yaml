apiVersion: v1
kind: Pod
metadata:
  name: cm-volume-demo
spec:
  volumes:
  - name: config                    # configMap 볼륨 — 아래 ConfigMap을 가리킴
    configMap:
      name: app-config
  containers:
  - name: shell
    image: busybox
    command: ["sleep", "3600"]      # 관찰용이라 그냥 오래 재운다
    volumeMounts:
    - name: config
      mountPath: /etc/config        # ConfigMap 엔트리가 이 디렉터리에 파일로 나타남
