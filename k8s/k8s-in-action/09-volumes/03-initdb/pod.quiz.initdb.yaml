# 단계 ③ init 컨테이너로 emptyDir 를 초기화하는 quiz 파드 (문서 09-01 §4)
# emptyDir 는 빈 채로 시작하므로 매번 손으로 질문을 넣어야 한다.
# init 컨테이너가 insert-questions.js 를 initdb 볼륨에 복사해 두면,
# mongo 가 첫 시작 시 /docker-entrypoint-initdb.d/ 에서 그 파일을 발견해 실행하고
# 질문으로 DB 를 자동으로 채운다.
#
# 순서 규칙: 파드의 모든 볼륨은 어느 컨테이너보다 먼저 만들어진다.
# 그래서 볼륨 → init 컨테이너(복사) → 본 컨테이너 순으로 뜨며,
# 이 순서는 매니페스트에서 볼륨을 앞에 쓰든 뒤에 쓰든 바뀌지 않는다.
apiVersion: v1
kind: Pod
metadata:
  name: quiz
spec:
  volumes:
  - name: initdb              # init 컨테이너가 채울 볼륨
    emptyDir: {}
  - name: quiz-data           # DB 파일용 볼륨(재시작 보존)
    emptyDir: {}
  initContainers:
  - name: installer
    image: luksa/quiz-initdb-script-installer:0.1
    volumeMounts:
    - name: initdb
      mountPath: /initdb.d    # init 컨테이너가 파일을 복사하는 위치
  containers:
  - name: quiz-api
    image: luksa/quiz-api:0.1
    ports:
    - name: http
      containerPort: 8080
  - name: mongo
    image: mongo
    volumeMounts:
    - name: quiz-data
      mountPath: /data/db
    - name: initdb                              # 같은 볼륨을 mongo 에도
      mountPath: /docker-entrypoint-initdb.d/   # MongoDB 가 초기화 스크립트를 찾는 위치
      readOnly: true
