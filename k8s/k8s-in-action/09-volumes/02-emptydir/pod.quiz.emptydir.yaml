# 단계 ② emptyDir 볼륨을 붙인 quiz 파드 (KIA Listing 9.2)
# ①과의 차이는 딱 두 곳 — (1) spec.volumes 에 emptyDir 정의, (2) mongo 에 volumeMounts.
# 이 두 줄이 데이터 생존을 가른다. mongo 재시작 시 /data/db 가 볼륨에 있어 질문이 보존된다.
apiVersion: v1
kind: Pod
metadata:
  name: quiz
spec:
  volumes:                     # (1) 볼륨을 파드 수준에 정의 — 파드가 소유
  - name: quiz-data
    emptyDir: {}               # {} 는 medium·sizeLimit 미지정을 명시(생략 가능)
  containers:
  - name: quiz-api
    image: luksa/quiz-api:0.1
    ports:
    - name: http
      containerPort: 8080
  - name: mongo
    image: mongo
    volumeMounts:              # (2) 그 볼륨을 컨테이너에 마운트
    - name: quiz-data          # spec.volumes 의 이름과 일치해야 함
      mountPath: /data/db      # MongoDB 가 파일을 쓰는 위치
