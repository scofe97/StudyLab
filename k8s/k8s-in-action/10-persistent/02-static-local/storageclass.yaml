# local StorageClass — "이런 종류의 스토리지가 있다"는 이름표.
# no-provisioner: 자동 생성기 없음 = 운영자가 PV를 손으로 만든다(정적 프로비저닝).
# WaitForFirstConsumer: 파드가 스케줄될 때까지 PVC↔PV 바인딩을 미룬다.
#   로컬 볼륨은 특정 노드에 묶여 있어, 파드가 어느 노드로 갈지 정해진 뒤 바인딩해야 어긋나지 않는다.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
