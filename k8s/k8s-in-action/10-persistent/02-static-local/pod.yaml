# Pod — PVC를 volume으로 참조해 실제로 마운트. 이 파드가 뜨는 순간 바인딩이 발동한다:
#   ① PVC↔PV 바인딩 ② 스케줄러가 PV의 nodeAffinity를 보고 파드를 k8s-lab-worker로 보냄 ③ 컨테이너가 로컬 볼륨 마운트
# 책의 MongoDB 대신 busybox로 경량화 — 볼륨에 파일을 쓰고 계속 살아 있게 sleep 한다.
apiVersion: v1
kind: Pod
metadata:
  name: quiz-local
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - 'echo "written by $(hostname) at boot" > /data/hello.txt; sleep 3600'
      volumeMounts:
        - name: quiz-data
          mountPath: /data
  volumes:
    - name: quiz-data
      persistentVolumeClaim:
        claimName: quiz-data-local
