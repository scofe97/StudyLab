frr version 10.2.1
frr defaults traditional
hostname r3
no ipv6 forwarding
!
interface lo
 ip address 10.0.0.3/32
!
router bgp 65002
 bgp router-id 10.0.0.3
 no bgp ebgp-requires-policy
 timers bgp 3 9
 ! eBGP — 다른 AS 65001 의 r1
 neighbor 172.30.0.2 remote-as 65001
 neighbor 172.30.0.2 description r1-eBGP
 !
 address-family ipv4 unicast
  network 10.0.0.3/32
  redistribute connected
 exit-address-family
!
