frr version 10.2.1
frr defaults traditional
hostname r1
no ipv6 forwarding
!
interface lo
 ip address 10.0.0.1/32
!
router bgp 65001
 bgp router-id 10.0.0.1
 no bgp ebgp-requires-policy
 timers bgp 3 9
 ! iBGP — 같은 AS 65001 안의 r2
 neighbor 172.30.0.3 remote-as 65001
 neighbor 172.30.0.3 description r2-iBGP
 ! eBGP — 다른 AS 65002 의 r3
 neighbor 172.30.0.4 remote-as 65002
 neighbor 172.30.0.4 description r3-eBGP
 !
 address-family ipv4 unicast
  network 10.0.0.1/32
  redistribute connected
 exit-address-family
!
