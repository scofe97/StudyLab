frr version 10.2.1
frr defaults traditional
hostname r2
no ipv6 forwarding
!
interface lo
 ip address 10.0.0.2/32
!
router bgp 65001
 bgp router-id 10.0.0.2
 no bgp ebgp-requires-policy
 timers bgp 3 9
 ! iBGP — 같은 AS 65001 안의 r1
 neighbor 172.30.0.2 remote-as 65001
 neighbor 172.30.0.2 description r1-iBGP
 !
 address-family ipv4 unicast
  network 10.0.0.2/32
  redistribute connected
 exit-address-family
!
