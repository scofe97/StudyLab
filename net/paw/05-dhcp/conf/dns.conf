# 묶음 C — 이름 서버. lab.test 의 기록을 직접 들고 있고, 모르는 이름은 밖에 묻지 않는다
no-resolv
no-hosts
interface=eth0
log-queries
# 주소 (A · AAAA)
host-record=web.lab.test,10.55.0.20,fd00:55::20
# 이름 하나에 주소 둘
host-record=multi.lab.test,10.55.0.41
host-record=multi.lab.test,10.55.0.42
# 이름 잇기 (CNAME) — www 는 web 의 별칭
cname=www.lab.test,web.lab.test
# 부가 정보 (MX · TXT)
mx-host=lab.test,mail.lab.test,10
host-record=mail.lab.test,10.55.0.25
txt-record=lab.test,"v=paw-lab"
# 512바이트를 넘는 응답을 만들기 위한 큰 TXT
txt-record=big.lab.test,"paw-lab-chunk-00-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx","paw-lab-chunk-01-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx","paw-lab-chunk-02-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx","paw-lab-chunk-03-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx","paw-lab-chunk-04-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx","paw-lab-chunk-05-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx","paw-lab-chunk-06-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx","paw-lab-chunk-07-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx","paw-lab-chunk-08-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx","paw-lab-chunk-09-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx","paw-lab-chunk-10-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx","paw-lab-chunk-11-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx","paw-lab-chunk-12-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx","paw-lab-chunk-13-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
# 이 서버가 lab.test 의 권한 서버인 것처럼 답한다 (NS · SOA)
auth-zone=lab.test
auth-server=server.lab.test,eth0
