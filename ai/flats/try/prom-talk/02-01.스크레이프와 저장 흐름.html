<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="스크레이프부터 TSDB 저장까지 세 시나리오를 비교하는 인터랙티브 학습 자료"><title>스크레이프와 저장 수명주기</title>
<style>
:root{--bg:#0d0d0d;--panel:#1a1a1a;--text:#e8e4df;--muted:#aaa39c;--line:#2a2520;--accent:#d4a853;--ok:#66bb6a;--bad:#ef6a63;--blue:#72a7d8}*{box-sizing:border-box}body{max-width:1100px;margin:auto;padding:30px 20px 48px;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;line-height:1.55}h1{font-size:clamp(1.8rem,5vw,2.7rem);margin:.2rem 0}h2{font-size:1.2rem;margin:0 0 12px}.eyebrow{color:var(--accent);font:700 .8rem ui-monospace,monospace;letter-spacing:.09em}.intro,.question{color:var(--muted)}.panel{margin-top:18px;padding:20px;border:1px solid var(--line);border-radius:12px;background:#111}.scenarios,.controls{display:flex;flex-wrap:wrap;gap:9px}button{min-height:42px;padding:9px 15px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--text);font:inherit;cursor:pointer}button:hover,button:focus-visible{border-color:var(--accent);outline:none}button[aria-pressed=true]{border-color:var(--accent);background:#2a2114;color:#f3d697}button:disabled{opacity:.4;cursor:not-allowed}.pipeline-wrap{overflow-x:auto;padding:8px 0 16px}.pipeline{display:flex;align-items:flex-start;min-width:max-content}.step{display:grid;justify-items:center;width:132px;padding:6px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:.84rem}.dot{display:grid;place-items:center;width:40px;height:40px;margin-bottom:7px;border:2px solid var(--line);border-radius:50%;background:var(--panel);font-family:ui-monospace,monospace}.step.done .dot{border-color:var(--ok)}.step.current{color:var(--accent)}.step.current .dot{border-color:var(--accent);background:#2a2114}.connector{width:34px;height:2px;margin-top:25px;background:var(--line)}.connector.done{background:var(--ok)}.counter{margin-left:auto;color:var(--muted);font-family:ui-monospace,monospace}.state-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.state{padding:13px;border-left:4px solid var(--line);background:var(--panel)}.state strong{display:block;color:var(--muted);font-size:.78rem}.state[data-tone=ok]{border-color:var(--ok)}.state[data-tone=bad]{border-color:var(--bad)}.state[data-tone=accent]{border-color:var(--accent)}.terminal{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:8px}.terminal.ok{border-color:var(--ok)}.terminal.bad{border-color:var(--bad)}kbd{padding:2px 6px;border:1px solid var(--line);border-radius:4px;background:var(--panel)}.help{font-size:.85rem;color:var(--muted)}
@media(max-width:620px){body{padding:18px 12px}.panel{padding:15px}.state-grid{grid-template-columns:1fr 1fr}.counter{width:100%;margin:0}.step{width:112px}.help{display:none}}@media(max-width:390px){.state-grid{grid-template-columns:1fr}.scenarios button,.controls button{flex:1 1 auto}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body>
<noscript><section class="panel"><h2>JavaScript 없이 보는 핵심</h2><p><strong>정상:</strong> SD 후보 → target relabel 통과 → collector 완료 → metric relabel 통과 → WAL/head → block.</p><p><strong>relabel drop:</strong> 타깃 relabel에서 후보가 제거되어 스크레이프와 저장이 없습니다.</p><p><strong>collector timeout:</strong> 가장 느린 collector가 제한 시간을 넘겨 스크레이프 전체가 실패하고 대상 샘플은 저장되지 않으며 Prometheus의 <code>up</code>은 0입니다.</p></section></noscript>
<main><header><p class="eyebrow">INTERACTIVE 1 · CH 3 / 4 / 8</p><h1>스크레이프 → 저장 수명주기</h1><p class="intro">같은 후보 타깃이 relabel 규칙과 collector 실행 결과에 따라 어디에서 멈추는지 비교합니다. 자동 재생은 꺼져 있습니다.</p></header>
<section class="panel" aria-labelledby="scenario-h"><h2 id="scenario-h">1. 시나리오 선택</h2><div id="scenarios" class="scenarios" aria-label="시나리오"></div><p id="question" class="question"></p></section>
<section class="panel" aria-labelledby="flow-h"><h2 id="flow-h">2. 단계 이동</h2><div class="pipeline-wrap"><div id="pipeline" class="pipeline"></div></div><div class="controls" aria-label="재생 조작"><button id="previous" type="button">이전</button><button id="play" type="button" aria-pressed="false">재생</button><button id="next" type="button">다음</button><span id="counter" class="counter" aria-live="polite"></span></div><p class="help"><kbd>←</kbd>/<kbd>→</kbd> 단계 이동 · <kbd>Space</kbd> 재생/일시 정지 · <kbd>1</kbd>~<kbd>3</kbd> 시나리오</p></section>
<section class="panel" aria-labelledby="explain-h"><h2 id="explain-h">3. 현재 단계 설명</h2><p id="narration" aria-live="polite"></p></section>
<section class="panel" aria-labelledby="state-h"><h2 id="state-h">4. 현재 상태</h2><div id="states" class="state-grid"></div><p id="terminal" class="terminal" aria-live="polite"></p></section></main>
<script>
const scenarios=[
{name:'정상',question:'샘플은 어느 시점부터 복구 가능해지고, 언제 영속 블록이 됩니까?',terminal:'정상 종료: 시계열 샘플은 WAL과 head를 거쳐 영속 블록에 들어갔습니다.',tone:'ok',steps:[
{label:'후보 발견',text:'서비스 디스커버리가 주소와 __meta_* 라벨을 후보로 냅니다.',s:[['후보','1개','accent'],['스크레이프','아직',''],['up','없음',''],['TSDB','변화 없음','']]},
{label:'타깃 relabel',text:'keep/drop 규칙을 통과합니다. 필요한 meta 라벨은 일반 라벨로 복사합니다.',s:[['최종 타깃','1개','ok'],['meta 라벨','정리됨','accent'],['스크레이프','대기',''],['TSDB','변화 없음','']]},
{label:'collector',text:'Node Exporter가 collector를 병렬 실행합니다. 가장 느린 collector도 timeout 안에 끝납니다.',s:[['collector','모두 완료','ok'],['최장 시간','timeout 미만','ok'],['응답','200 OK','ok'],['up','1 예정','accent']]},
{label:'메트릭 relabel',text:'받은 시계열에서 저장하지 않을 항목만 제거합니다.',s:[['타깃','유지','ok'],['시계열','선별됨','accent'],['up','1','ok'],['TSDB','append 대기','']]},
{label:'WAL + head',text:'샘플은 WAL에 먼저 기록되고 현재 수집 구간인 head에 추가됩니다.',s:[['WAL','기록됨','ok'],['head','샘플 추가','ok'],['블록','아직',''],['복구','가능','ok']]},
{label:'영속 블록',text:'head의 시간 구간이 닫히면 불변 블록이 생기고 이후 컴팩션과 보존의 대상이 됩니다.',s:[['블록','생성됨','ok'],['컴팩션','대기','accent'],['보존','정책 적용','accent'],['최종','저장 성공','ok']]}
]},
{name:'relabel drop',question:'타깃 relabeling에서 drop되면 collector와 TSDB에는 어떤 흔적이 남습니까?',terminal:'종료: 후보는 타깃 relabeling에서 제거됐습니다. 스크레이프·collector 실행·대상 샘플 저장은 없습니다.',tone:'bad',steps:[
{label:'후보 발견',text:'서비스 디스커버리는 후보를 정상적으로 찾았습니다.',s:[['후보','1개','accent'],['최종 타깃','미결정',''],['스크레이프','아직',''],['TSDB','변화 없음','']]},
{label:'타깃 relabel',text:'drop 규칙이 후보와 일치해 최종 타깃 목록에서 제거합니다.',s:[['후보','drop','bad'],['최종 타깃','0개','bad'],['스크레이프','실행 안 함',''],['TSDB','변화 없음','']]},
{label:'종료',text:'대상이 없으므로 /metrics 요청 자체가 없고 metric relabeling도 실행되지 않습니다.',s:[['collector','실행 안 함',''],['up','새 샘플 없음',''],['WAL','기록 없음',''],['최종','타깃 제외','bad']]}
]},
{name:'collector timeout',question:'collector 하나가 timeout을 넘으면 부분 결과를 저장할까요?',terminal:'실패 종료: 스크레이프 전체가 실패했습니다. 대상 메트릭은 append되지 않고 Prometheus가 생성하는 up=0만 기록됩니다.',tone:'bad',steps:[
{label:'후보 발견',text:'서비스 디스커버리와 타깃 relabeling을 정상 통과합니다.',s:[['최종 타깃','1개','ok'],['스크레이프','대기',''],['up','이전 값',''],['TSDB','변화 없음','']]},
{label:'요청 시작',text:'Prometheus가 /metrics를 요청하고 여러 collector가 병렬로 시작합니다.',s:[['collector','병렬 실행','accent'],['빠른 항목','완료','ok'],['느린 항목','실행 중','accent'],['응답','대기','']]},
{label:'timeout',text:'가장 느린 collector가 scrape_timeout을 넘겨 전체 HTTP 스크레이프가 실패합니다.',s:[['느린 collector','timeout','bad'],['스크레이프','실패','bad'],['부분 응답','채택 안 함','bad'],['up','0 예정','accent']]},
{label:'종료',text:'대상에서 받은 부분 메트릭은 TSDB에 쓰지 않습니다. Prometheus 자체 생성 메트릭 up=0은 실패 사실을 남깁니다.',s:[['대상 샘플','append 없음','bad'],['WAL','대상 값 없음',''],['up','0 기록','bad'],['진단','duration 확인','accent']]}
]}
];let si=0,step=0,timer=null;const reduce=matchMedia('(prefers-reduced-motion:reduce)');const $=q=>document.querySelector(q);
function current(){return scenarios[si]}function stop(){clearInterval(timer);timer=null;$('#play').textContent='재생';$('#play').setAttribute('aria-pressed','false')}
function render(){const sc=current();$('#scenarios').replaceChildren(...scenarios.map((x,i)=>{const b=document.createElement('button');b.type='button';b.textContent=x.name;b.setAttribute('aria-pressed',String(i===si));b.onclick=()=>{si=i;step=0;stop();render()};return b}));$('#question').textContent='관찰 질문: '+sc.question;$('#pipeline').replaceChildren(...sc.steps.flatMap((x,i)=>{const b=document.createElement('button');b.type='button';b.className='step'+(i<step?' done':'')+(i===step?' current':'');b.setAttribute('aria-pressed',String(i===step));if(i===step)b.setAttribute('aria-current','step');b.innerHTML='<span class="dot">'+(i+1)+'</span><span>'+x.label+'</span>';b.onclick=()=>{step=i;stop();render()};if(i===sc.steps.length-1)return[b];const c=document.createElement('span');c.className='connector'+(i<step?' done':'');c.setAttribute('aria-hidden','true');return[b,c]}));const x=sc.steps[step];$('#narration').textContent=x.text;$('#states').replaceChildren(...x.s.map(([k,v,t])=>{const d=document.createElement('div');d.className='state';d.dataset.tone=t;d.innerHTML='<strong>'+k+'</strong><span>'+v+'</span>';return d}));$('#counter').textContent=(step+1)+' / '+sc.steps.length+' · '+sc.name;$('#previous').disabled=step===0;$('#next').disabled=step===sc.steps.length-1;const end=step===sc.steps.length-1;$('#terminal').textContent=end?sc.terminal:'종료 상태는 마지막 단계에서 확인합니다.';$('#terminal').className='terminal '+(end?sc.tone:'')}
$('#previous').onclick=()=>{step=Math.max(0,step-1);stop();render()};$('#next').onclick=()=>{step=Math.min(current().steps.length-1,step+1);stop();render()};$('#play').onclick=()=>{if(timer){stop();return}if(reduce.matches){step=Math.min(current().steps.length-1,step+1);render();return}if(step===current().steps.length-1)step=0;$('#play').textContent='일시 정지';$('#play').setAttribute('aria-pressed','true');timer=setInterval(()=>{if(step===current().steps.length-1){stop();return}step++;render()},1500)};addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON')return;if(e.key==='ArrowLeft')$('#previous').click();if(e.key==='ArrowRight')$('#next').click();if(e.key===' '){e.preventDefault();$('#play').click()}if(['1','2','3'].includes(e.key)){si=Number(e.key)-1;step=0;stop();render()}});render();
</script></body></html>
