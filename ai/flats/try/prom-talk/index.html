<body><noscript><section class="card" style="max-width:760px;margin:40px auto"><h1 style="margin-top:0">Prometheus 3·4·5·8장 핵심</h1><p>3장은 라벨이 시계열을 정하고 샘플이 WAL·head·block으로 저장되는 과정, 역색인이 질의를 이끄는 방식, mmap, 그리고 PromQL의 집계·벡터 매칭과 staleness를 다룹니다. 4장은 서비스 디스커버리와 스크레이프 전후 relabeling을 구분합니다. 5장은 Prometheus의 inactive·pending·firing과 Alertmanager의 그룹핑·라우팅·억제·시간 구간을 분리하고, promtool 룰 단위 테스트와 로드밸런서를 두면 안 되는 HA 구성을 설명합니다. 8장은 Node Exporter collector가 병렬로 실행되며 가장 느린 collector가 timeout을 결정한다는 점을 설명합니다.</p><p>JavaScript를 사용할 수 없으면 같은 폴더의 PDF와 <a href="02-01.%EC%8A%A4%ED%81%AC%EB%A0%88%EC%9D%B4%ED%94%84%EC%99%80%20%EC%A0%80%EC%9E%A5%20%ED%9D%90%EB%A6%84.html">스크레이프·저장 수명주기</a>, <a href="02-02.%EC%95%8C%EB%A6%BC%20%ED%9D%90%EB%A6%84.html">알림 수명주기</a>의 정적 설명을 확인하세요.</p></section></noscript><main class="deck" id="deck"></main><nav class="controls" aria-label="슬라이드 이동"><button id="prev" type="button">이전</button><button id="next" type="button">다음</button><button id="print" type="button">PDF 인쇄</button></nav>
<script>
const S=[
['시작','intro','<p class="tag">MASTERING PROMETHEUS</p><h1>Prometheus가 관측값을<br><span class="accent">믿을 만한 신호</span>로 만드는 과정</h1><p class="lead">데이터가 태어나 저장되고, 대상을 찾고, 경고가 사람에게 도착하기까지를 한 흐름으로 봅니다.</p>','README 장별 목표','기초부터 운영 판단까지','title-slide'],
['시작','intro','<h2>오늘 따라갈 한 줄</h2><div class="intro-block"><p class="lead">대상을 찾는다 → 값을 긁는다 → 시계열로 저장한다 → 규칙을 평가한다 → 알림을 묶어 사람에게 보낸다.</p></div><p class="sub">다섯 단계를 <strong>순서 그대로</strong> 따라갑니다.</p><div class="grid2"><div class="card"><h3>먼저 짚을 용어 넷</h3><ul><li><strong>메트릭</strong>: 측정 대상의 이름</li><li><strong>라벨</strong>: 같은 메트릭을 쪼개는 꼬리표</li><li><strong>스크레이프</strong>: 서버가 <code>/metrics</code>를 주기적으로 <span class="accent">가져가는</span> 일</li><li><strong>알림</strong>: 조건이 <span class="accent">일정 시간</span> 참일 때 생기는 상태</li></ul></div><div class="card"><h3>오늘의 순서</h3><ol><li><span class="accent">수집</span> — 무엇을 긁을지 고르고, 값은 누가 만드는가</li><li><span class="accent">저장</span> — 그 값이 어떤 모양으로 쌓이는가</li><li><span class="accent">조회</span> — 쌓인 값을 어떻게 읽는가</li><li><span class="accent">알림</span> — 두 프로그램의 책임 분리</li></ol></div></div><p class="callout">맨 위 문장의 <span class="accent">다섯 단계를 순서 그대로</span> 따라갑니다. 값이 태어나는 자리에서 시작해, 사람에게 도착하는 데서 끝납니다.</p>','04-01 §전체 흐름 · 03-01 §메트릭·시계열·샘플','전체 지도'],
['수집','divider','<p class="tag">STEP 1 / 4</p><h1>수집 — 무엇을 긁고,<br><span class="accent">값은 누가 만드는가</span></h1><p class="lead">대상을 찾는다 → 값을 긁는다</p><div><span class="pill">서비스 디스커버리</span><span class="pill">relabeling</span><span class="pill">Exporter · collector</span><span class="pill">디버깅</span></div>','04-01 · 08-01','수집 시작','title-slide'],
['수집','ch4','<h2>서비스 디스커버리는 후보만 만듭니다</h2><div class="intro-block"><p class="lead">Prometheus는 스스로 대상을 알지 못합니다. <span class="accent">"어디를 긁어야 하는지" 주소 목록을 대신 받아 오는 일</span>이 서비스 디스커버리입니다.</p></div><p class="sub">파드는 뜨고 지고 IP도 계속 바뀝니다. 그래서 주소를 설정 파일에 적지 않습니다. 대신 <strong>API에 주기적으로 다시 물어봅니다.</strong></p><p class="flowline"><b>API에 묻는다</b><span class="arw">→</span><b>후보 목록</b><span class="arw">→</span>relabeling이 고른다<span class="arw">→</span>남은 주소를 긁는다</p><div class="grid3"><div class="card"><h3>발견</h3><p>후보 목록과 <code>__meta_*</code> 라벨을 받습니다.</p><p class="muted">아직 <strong>아무것도 긁지 않은</strong> 상태입니다.</p></div><div class="card"><h3>선별</h3><p>relabeling이 <strong>남길 대상</strong>을 결정합니다.</p><p class="muted">여기서 후보 수가 <strong>줄어듭니다.</strong></p></div><div class="card"><h3>스크레이프</h3><p>살아남은 최종 주소로 요청합니다.</p><p class="muted">이때 비로소 <strong>값이 생깁니다.</strong></p></div></div><p class="callout">SD는 <span class="accent">후보만</span> 냅니다. 값은 exporter가 만들고, 무엇을 긁을지는 relabeling이 정합니다 — 셋의 책임이 다릅니다.</p>','04-01 §1 서비스 디스커버리는 후보만 찾습니다','대상 발견'],
['수집','ch4','<h2>relabeling은 두 번 돌고, 거르는 것이 다릅니다</h2><div class="intro-block"><p class="lead">이름이 닮아 헷갈리지만 <span class="accent">놓인 자리가 다르고, 그래서 거르는 대상도 다릅니다.</span></p></div><p class="sub">앞의 것은 <strong>긁기 전</strong>에 돌아 대상을 고르고, 뒤의 것은 <strong>저장하기 전</strong>에 돌아 시계열을 고릅니다.</p><table class="compare"><tr><th></th><th><code>relabel_configs</code></th><th><code>metric_relabel_configs</code></th></tr><tr><td>언제 도는가</td><td>스크레이프 <span class="accent">전</span></td><td>저장 <span class="accent">전</span></td></tr><tr><td>무엇을 거르는가</td><td><strong>타깃</strong> — 긁을 대상</td><td><strong>시계열</strong> — 저장할 값</td></tr><tr><td>무엇이 줄어드는가</td><td>스크레이프 부하 · 네트워크</td><td>카디널리티 · 디스크</td></tr><tr><td>못 하는 일</td><td class="muted">이미 받은 값은 못 거름</td><td class="muted">긁는 것 자체는 못 막음</td></tr></table><p class="question">특정 파드를 <em>아예 긁지 않으려면</em> 어느 쪽일까요?</p><p class="answer">정답: <code>relabel_configs</code>입니다. metric 쪽은 이미 긁은 뒤라 부하가 그대로 듭니다.</p>','04-01 §2 relabeling 은 두 번 돕니다','두 번 돈다'],
['수집','ch4','<h2>후보에서 저장까지, 무엇이 걸러지는가</h2><div class="intro-block"><p class="lead">단계마다 <span class="accent">걸러지는 것도, 남는 라벨도</span> 달라집니다.</p></div><p class="sub">각 단계에서 <strong>무엇이 몇 개 남는지</strong>를 함께 보면 두 relabeling의 차이가 드러납니다.</p><svg class="viz" style="width:100%;height:437px" viewBox="-6 -6 1282 486" role="img"><title>수집 파이프라인 상세 흐름</title><desc>서비스 디스커버리가 후보와 __meta_ 라벨을 만들고, 타깃 relabeling이 대상을 걸러 스크레이프한 뒤, 메트릭 relabeling이 시계열을 걸러 TSDB에 저장합니다. __meta_ 라벨은 스크레이프 직전에 사라집니다.</desc><defs><marker id="fa" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6z" fill="#d4a853"/></marker></defs><g text-anchor="middle"><rect x="16" y="66" width="176" height="96" rx="11" fill="#1a1a1a" stroke="#72a7d8" stroke-width="3"/><text x="104" y="100" fill="#72a7d8" font-size="18" font-weight="700">① 서비스 발견</text><text x="104" y="126" fill="#e8e4df" font-size="16">쿠버네티스 API</text><text x="104" y="148" fill="#aaa39c" font-size="16">후보 120개</text><rect x="286" y="66" width="212" height="96" rx="11" fill="#1a1a1a" stroke="#d4a853" stroke-width="3"/><text x="392" y="100" fill="#d4a853" font-size="18" font-weight="700">② relabel_configs</text><text x="392" y="126" fill="#e8e4df" font-size="16">keep / drop 으로 선별</text><text x="392" y="148" fill="#66bb6a" font-size="16">타깃 40개만 남음</text><rect x="592" y="66" width="176" height="96" rx="11" fill="#d4a853"/><text x="680" y="100" fill="#0d0d0d" font-size="18" font-weight="700">③ 스크레이프</text><text x="680" y="126" fill="#0d0d0d" font-size="16">HTTP GET /metrics</text><text x="680" y="148" fill="#0d0d0d" font-size="16">시계열 8,000</text><rect x="862" y="66" width="212" height="96" rx="11" fill="#1a1a1a" stroke="#ef6a63" stroke-width="3"/><text x="968" y="100" fill="#ef6a63" font-size="18" font-weight="700">④ metric_relabel</text><text x="968" y="126" fill="#e8e4df" font-size="16">시계열 drop</text><text x="968" y="148" fill="#66bb6a" font-size="16">5,000만 저장</text></g><path d="M192 114H276" stroke="#d4a853" stroke-width="3.5" marker-end="url(#fa)"/><path d="M498 114H582" stroke="#d4a853" stroke-width="3.5" marker-end="url(#fa)"/><path d="M768 114H852" stroke="#d4a853" stroke-width="3.5" marker-end="url(#fa)"/><path d="M1074 114H1150" stroke="#66bb6a" stroke-width="3.5" marker-end="url(#fa)"/><rect x="1160" y="84" width="92" height="60" rx="10" fill="#1a1a1a" stroke="#66bb6a" stroke-width="3"/><text x="1206" y="112" fill="#66bb6a" font-size="17" font-weight="700" text-anchor="middle">TSDB</text><text x="1206" y="132" fill="#e8e4df" font-size="16" text-anchor="middle">저장</text><text x="16" y="212" fill="#aaa39c" font-size="16" font-weight="700">라벨이 살아 있는 구간</text><rect x="16" y="228" width="752" height="52" rx="8" fill="#1c1915" stroke="#d4a853" stroke-width="2" stroke-dasharray="6 4"/><text x="392" y="252" fill="#d4a853" font-size="16" text-anchor="middle">__meta_kubernetes_pod_label_app · __meta_..._node_name · __address__</text><text x="392" y="271" fill="#aaa39c" font-size="16" text-anchor="middle">대상을 고르는 데 쓰는 임시 재료 — 화면에도 보입니다</text><path d="M772 254H852" stroke="#ef6a63" stroke-width="3.5" marker-end="url(#fa)"/><rect x="862" y="228" width="212" height="52" rx="8" fill="#241615" stroke="#ef6a63" stroke-width="2"/><text x="968" y="252" fill="#ef6a63" font-size="16" text-anchor="middle" font-weight="700">__ 로 시작하면 전부 삭제</text><text x="968" y="271" fill="#aaa39c" font-size="16" text-anchor="middle">스크레이프 직후</text><rect x="16" y="300" width="1148" height="72" rx="8" fill="#141b22" stroke="#72a7d8" stroke-width="2"/><text x="36" y="326" fill="#72a7d8" font-size="16" font-weight="700">남기려면 옮겨 담아야 합니다</text><text x="36" y="352" fill="#d9e8f5" font-size="16" font-family="ui-monospace,monospace">source_labels: [__meta_kubernetes_pod_node_name] → target_label: node   (이제 저장됩니다)</text><text x="104" y="404" fill="#72a7d8" font-size="16" text-anchor="middle">주소를 받는다</text><text x="392" y="404" fill="#d4a853" font-size="16" text-anchor="middle">긁을 대상을 고른다</text><text x="680" y="404" fill="#d4a853" font-size="16" text-anchor="middle">값을 가져온다</text><text x="968" y="404" fill="#ef6a63" font-size="16" text-anchor="middle">저장할 값을 고른다</text><path d="M16 422H498" stroke="#2a2520" stroke-width="1"/><path d="M592 422H1074" stroke="#2a2520" stroke-width="1"/><text x="257" y="448" fill="#aaa39c" font-size="16" text-anchor="middle">여기까지는 <tspan fill="#d4a853">타깃</tspan> 개수가 줄어듭니다</text><text x="833" y="448" fill="#aaa39c" font-size="16" text-anchor="middle">여기서는 <tspan fill="#ef6a63">시계열</tspan> 개수가 줄어듭니다</text></svg>','04-01 §2 relabeling · §3 __meta_ 의 수명 · 인라인 SVG','전체 흐름'],
['수집','ch4','<h2>규칙 하나는 부품 다섯으로 읽습니다</h2><div class="intro-block"><p class="lead">규칙은 <span class="accent">"어떤 라벨을 보고, 무엇에 맞으면, 어떻게 한다"</span>의 반복입니다.</p></div><p class="sub">아래는 <strong>app=api 라벨이 붙은 파드만 긁겠다</strong>는 규칙입니다.</p><div class="grid2"><div><code class="big-code">relabel_configs:\n  - source_labels:\n      [__meta_..._label_app]\n    regex: api\n    action: keep</code><p class="note">이 네 줄은 이렇게 읽습니다.</p><ol style="margin-top:8px"><li>파드에 붙은 <code>app</code> 라벨 값을 본다</li><li>그 값이 <code>api</code>와 정확히 같은가</li><li>같으면 <strong>남기고</strong>, 아니면 버린다</li></ol></div><div><table class="compare" style="--rowpad:12px"><tr><th>필드</th><th>뜻</th></tr><tr><td><code>source_labels</code></td><td>어떤 라벨의 값을 볼 것인가</td></tr><tr><td><code>regex</code></td><td>그 값이 이 패턴에 맞는가 <span class="muted">(기본 <code>(.*)</code>)</span></td></tr><tr><td><code>action</code></td><td>맞으면 무엇을 할 것인가 <span class="muted">(기본 <code>replace</code>)</span></td></tr><tr><td><code>target_label</code></td><td>어느 라벨에 쓸 것인가</td></tr><tr><td><code>replacement</code></td><td>실제로 쓸 값 <span class="muted">(기본 <code>$1</code> 첫 캡처)</span></td></tr></table></div></div><p class="callout"><code>regex</code>는 <span class="accent">양쪽 끝이 앵커링</span>됩니다. 부분 일치를 원하면 <code>.*api.*</code>로 풀어야 합니다.</p>','04-01 §3 규칙 하나는 어떻게 읽습니까','규칙 문법'],
['수집','ch4','<h2>후보 수를 바꾸는 액션은 둘뿐입니다</h2><div class="intro-block"><p class="lead"><code>action</code>이 <span class="accent">대상을 줄일지, 라벨만 손댈지</span>를 가릅니다.</p></div><p class="sub">현행 문서는 액션을 <strong>11개</strong> 정의하지만, 실무에서 손이 가는 것은 아래 다섯입니다.</p><div class="grid2"><div><code class="big-code">action: keep    # 남길 것만\naction: drop    # 뺄 것만\n\naction: replace # 값 옮기기\naction: labeldrop\naction: labelmap</code><p class="note"><code>keep</code>과 <code>drop</code>은 서로 반대라 <strong>하나로 같은 일을 표현</strong>할 수 있습니다. 정규식이 단순해지는 쪽을 고르는 것이 관례입니다.</p></div><div><table class="compare" style="--rowpad:12px"><tr><th>액션</th><th>하는 일</th><th>후보 수</th></tr><tr><td><code>keep</code></td><td>매칭되는 것만 남김</td><td class="accent">줄어듦</td></tr><tr><td><code>drop</code></td><td>매칭되는 것을 버림</td><td class="accent">줄어듦</td></tr><tr><td><code>replace</code></td><td>읽은 <strong>값</strong>을 옮겨 씀</td><td class="muted">안 바뀜</td></tr><tr><td><code>labeldrop</code></td><td>라벨 <strong>이름</strong>을 지움</td><td class="muted">안 바뀜</td></tr><tr><td><code>labelmap</code></td><td>라벨 이름을 복사</td><td class="muted">안 바뀜</td></tr></table></div></div><p class="callout"><code>replace</code>는 <span class="accent">값</span>을, <code>labeldrop</code>은 <span class="accent">라벨 자체</span>를 다룹니다. 이름이 비슷해 자주 헷갈리는 자리입니다.</p>','04-01 §3 액션 11개 중 실무 다섯','액션'],
['수집','ch4','<h2>쿠버네티스에서는 Operator가 대신 씁니다</h2><div class="intro-block"><p class="lead">지금까지 본 <span class="accent">SD 설정과 relabeling 규칙을 손으로 쓰지 않습니다.</span></p></div><p class="sub">사람은 <strong>ServiceMonitor</strong>에 "어느 서비스의 어느 포트를 긁어라"만 적습니다. 그것을 Operator가 <strong>실제 scrape 설정으로 번역</strong>합니다.</p><p class="flowline"><b>ServiceMonitor</b> 작성<span class="arw">→</span>Operator가 번역<span class="arw">→</span><b>prometheus.yaml</b> 생성<span class="arw">→</span>사이드카가 재적재</p><table class="compare"><tr><th>긁을 대상</th><th>사람이 쓰는 것</th><th>Operator가 하는 일</th></tr><tr><td>K8s Service·Pod</td><td><code>ServiceMonitor</code> · <code>PodMonitor</code></td><td>selector를 <code>kubernetes_sd</code> + relabel 규칙으로 <span class="accent">번역</span></td></tr><tr><td>블랙박스 프로빙</td><td><code>Probe</code></td><td>대응 SD와 스크레이프 설정 생성</td></tr><tr><td>EC2 · 사내 SD</td><td><code>additionalScrapeConfigs</code></td><td class="muted">번역 없음 — 처음부터 SD 문법으로 직접</td></tr></table><p class="callout">두 경로는 <span class="accent">번역 단계가 있느냐</span>로 갈립니다. <code>additionalScrapeConfigs</code>는 YAML을 직접 받지 않고 <span class="accent">Secret의 키</span>를 가리킵니다 — 스크레이프 설정에 자격증명이 섞이기 쉬워 평문 필드를 피한 설계입니다.</p>','04-01 §4 Operator 는 두 경로로 설정을 만듭니다','Operator'],
['수집','ch4','<h2>안 긁힐 때는 증상으로 화면을 고릅니다</h2><div class="intro-block"><p class="lead">여기까지가 대상을 고르는 과정입니다. <span class="accent">문제는 대개 두 화면 중 하나에서 갈립니다.</span></p></div><p class="sub"><code>/service-discovery</code>는 <strong>발견과 선별</strong>을, <code>/targets</code>는 <strong>연결</strong>을 보여 줍니다. 앞이 정상인데 뒤가 DOWN이면 <strong>고칠 곳은 대상 쪽</strong>입니다.</p><div class="grid2"><div><table class="compare"><tr><th>증상</th><th>볼 화면</th></tr><tr><td>타깃이 아예 없음</td><td><code>/service-discovery</code></td></tr><tr><td>라벨이 예상과 다름</td><td><code>/service-discovery</code></td></tr><tr><td>타깃은 있는데 DOWN</td><td><code>/targets</code></td></tr></table></div><div><table class="compare"><tr><th><code>lastError</code></th><th>볼 곳</th></tr><tr><td>connection refused</td><td>대상의 바인딩 주소</td></tr><tr><td>404 Not Found</td><td><code>metrics_path</code></td></tr><tr><td>context deadline exceeded</td><td><code>scrape_timeout</code></td></tr></table></div></div><p class="callout"><code>up=0</code>은 <span class="bad">실패했다는 사실만</span> 말합니다. kubeadm 클러스터의 <code>connection refused</code>는 대개 메트릭이 <strong>루프백에만</strong> 바인딩된 것이지 설정 실수가 아닙니다.</p><p class="note">여기까지는 전부 <strong>주소를 고르는 일</strong>이었습니다. 그런데 주소를 찾아가도 <span class="accent">거기에 값이 저절로 있는 것은 아닙니다.</span> 그 <code>/metrics</code>를 열어 두고 값을 내놓는 쪽이 따로 있습니다.</p>','04-01 §5 디버깅은 증상으로 화면을 고릅니다','디버깅'],
['수집','ch8','<h2>Exporter는 다른 시스템의 값을 번역합니다</h2><div class="intro-block"><p class="lead">주소를 고르는 일과 <span class="accent">값을 만드는 일은 다른 쪽이 맡습니다.</span> 값을 내놓는 쪽이 exporter입니다.</p></div><p class="sub">서비스 디스커버리가 "<strong>어디로 갈지</strong>"를 정했다면, exporter는 그 자리에서 "<strong>무엇을 줄지</strong>"를 정합니다. 부품은 셋이고 각각 다른 시점에 일합니다.</p><svg class="viz" style="width:100%;height:314px" viewBox="-4 -4 1160 316" role="img"><title>exporter 세 부품과 두 시점</title><desc>등록 시점에 Describe 가 형상만 알리고, 스크레이프가 방아쇠가 되어 Collect 가 그 순간 값을 읽어 채웁니다.</desc><defs><marker id="e1" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6z" fill="#d4a853"/></marker><marker id="e2" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6z" fill="#66bb6a"/></marker></defs><text x="8" y="20" fill="#72a7d8" font-size="16" font-weight="700">① 등록 시점 — 한 번</text><rect x="8" y="36" width="176" height="72" rx="10" fill="#1a1a1a" stroke="#72a7d8" stroke-width="3"/><text x="96" y="66" fill="#72a7d8" font-size="16" font-weight="700" text-anchor="middle">메트릭 정의</text><text x="96" y="90" fill="#e8e4df" font-size="16" text-anchor="middle">이름 · HELP · 라벨</text><path d="M184 72H236" stroke="#d4a853" stroke-width="3" marker-end="url(#e1)"/><text x="210" y="60" fill="#aaa39c" font-size="16" text-anchor="middle">형상</text><rect x="246" y="36" width="176" height="72" rx="10" fill="#1a1a1a" stroke="#d4a853" stroke-width="3"/><text x="334" y="66" fill="#d4a853" font-size="16" font-weight="700" text-anchor="middle">collector</text><text x="334" y="90" fill="#e8e4df" font-size="16" text-anchor="middle">Describe · Collect</text><path d="M422 72H474" stroke="#d4a853" stroke-width="3" marker-end="url(#e1)"/><text x="448" y="60" fill="#aaa39c" font-size="16" text-anchor="middle">등록</text><rect x="484" y="36" width="190" height="72" rx="10" fill="#d4a853"/><text x="579" y="66" fill="#0d0d0d" font-size="16" font-weight="700" text-anchor="middle">레지스트리</text><text x="579" y="90" fill="#0d0d0d" font-size="16" text-anchor="middle">프로세스에 하나</text><text x="700" y="66" fill="#aaa39c" font-size="16">Node Exporter는</text><text x="700" y="90" fill="#aaa39c" font-size="16">여기에 collector <tspan fill="#d4a853" font-weight="700">45개</tspan>를 답니다</text><text x="8" y="160" fill="#66bb6a" font-size="16" font-weight="700">② 스크레이프 시점 — 매번</text><rect x="8" y="176" width="176" height="72" rx="10" fill="#1a1a1a" stroke="#66bb6a" stroke-width="3"/><text x="96" y="206" fill="#66bb6a" font-size="16" font-weight="700" text-anchor="middle">Prometheus</text><text x="96" y="230" fill="#e8e4df" font-size="16" text-anchor="middle">GET /metrics</text><path d="M184 212H236" stroke="#66bb6a" stroke-width="3" marker-end="url(#e2)"/><rect x="246" y="176" width="190" height="72" rx="10" fill="#1a1a1a" stroke="#66bb6a" stroke-width="3"/><text x="341" y="206" fill="#66bb6a" font-size="16" font-weight="700" text-anchor="middle">Collect() 호출</text><text x="341" y="230" fill="#e8e4df" font-size="16" text-anchor="middle">45개 전부</text><path d="M436 212H488" stroke="#66bb6a" stroke-width="3" marker-end="url(#e2)"/><rect x="498" y="176" width="190" height="72" rx="10" fill="#1a1a1a" stroke="#66bb6a" stroke-width="3"/><text x="593" y="206" fill="#66bb6a" font-size="16" font-weight="700" text-anchor="middle">그 순간 읽는다</text><text x="593" y="230" fill="#e8e4df" font-size="16" text-anchor="middle">/proc/stat · DB</text><path d="M688 212H740" stroke="#66bb6a" stroke-width="3" marker-end="url(#e2)"/><rect x="750" y="176" width="176" height="72" rx="10" fill="#1a1a1a" stroke="#d4a853" stroke-width="3"/><text x="838" y="206" fill="#d4a853" font-size="16" font-weight="700" text-anchor="middle">텍스트로 응답</text><text x="838" y="230" fill="#e8e4df" font-size="16" text-anchor="middle">형상 + 값</text><text x="948" y="212" fill="#ef6a63" font-size="16">값을 미리</text><text x="948" y="234" fill="#ef6a63" font-size="16">담아 두지 않습니다</text><path d="M8 130H1150" stroke="#2a2520" stroke-width="1"/></svg><p class="callout"><code>Describe</code>는 등록 때 <span class="accent">형상</span>만, <code>Collect</code>는 스크레이프 때 <span class="accent">그 순간의 값</span>을 냅니다. 그래서 <strong>스크레이프가 방아쇠</strong>입니다.</p>','08-01 §1 exporter 란 무엇인가 · §2 세 부품','해부'],
['수집','ch8','<h2>collector는 각각 고루틴으로 동시에 돕니다</h2><div class="intro-block"><p class="lead">Node Exporter는 collector마다 <span class="accent">별도 고루틴</span>을 띄웁니다. 그래서 개수가 늘어도 느려지지 않습니다.</p></div><p class="sub">전체 응답 시간은 <strong>합이 아니라 가장 느린 하나</strong>입니다.</p><svg class="viz" style="width:100%;height:234px" viewBox="-4 -4 1160 236" role="img"><title>collector 고루틴 병렬 실행</title><desc>레지스트리가 collector 45개를 각각 별도 고루틴으로 동시에 실행하므로 전체 응답 시간은 합이 아니라 가장 느린 하나입니다.</desc><defs><marker id="g1" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6z" fill="#d4a853"/></marker></defs><rect x="8" y="70" width="176" height="76" rx="10" fill="#d4a853"/><text x="96" y="102" fill="#0d0d0d" font-size="16" font-weight="700" text-anchor="middle">레지스트리</text><text x="96" y="126" fill="#0d0d0d" font-size="16" text-anchor="middle">Collect() 호출</text><path d="M184 108H232V30H286" fill="none" stroke="#d4a853" stroke-width="3" marker-end="url(#g1)"/><path d="M232 108H286" stroke="#d4a853" stroke-width="3" marker-end="url(#g1)"/><path d="M232 108V186H286" fill="none" stroke="#d4a853" stroke-width="3" marker-end="url(#g1)"/><text x="238" y="152" fill="#72a7d8" font-size="16">고루틴 45개</text><rect x="296" y="12" width="196" height="36" rx="7" fill="#1a1a1a" stroke="#66bb6a" stroke-width="2"/><text x="310" y="35" fill="#e8e4df" font-size="16">cpu</text><text x="476" y="35" fill="#66bb6a" font-size="16" text-anchor="end">12ms</text><rect x="296" y="90" width="420" height="36" rx="7" fill="#1a1a1a" stroke="#ef6a63" stroke-width="3"/><text x="310" y="113" fill="#e8e4df" font-size="16">filesystem</text><text x="700" y="113" fill="#ef6a63" font-size="16" font-weight="700" text-anchor="end">180ms ← 가장 느림</text><rect x="296" y="168" width="160" height="36" rx="7" fill="#1a1a1a" stroke="#66bb6a" stroke-width="2"/><text x="310" y="191" fill="#e8e4df" font-size="16">meminfo</text><text x="440" y="191" fill="#66bb6a" font-size="16" text-anchor="end">8ms</text><path d="M726 108H780" stroke="#d4a853" stroke-width="3" marker-end="url(#g1)"/><rect x="790" y="70" width="250" height="76" rx="10" fill="#1a1a1a" stroke="#d4a853" stroke-width="3"/><text x="915" y="100" fill="#d4a853" font-size="16" font-weight="700" text-anchor="middle">전체 ≈ 180ms</text><text x="915" y="124" fill="#e8e4df" font-size="16" text-anchor="middle">합(200ms)이 아닙니다</text><text x="1056" y="100" fill="#aaa39c" font-size="16">동시에 돌므로</text><text x="1056" y="124" fill="#aaa39c" font-size="16"><tspan fill="#d4a853" font-weight="700">최댓값</tspan>이 병목</text></svg><p class="callout">속도를 높이려고 collector 수를 줄일 이유는 없습니다. 다만 이는 <span class="accent">Node Exporter에 국한된</span> 이야기입니다.</p>','08-01 §2 collector 고루틴 병렬 실행','병렬 실행'],
['수집','ch8','<h2>메모리는 free와 available을 구분합니다</h2><div class="intro-block"><p class="lead">둘을 헷갈리면 <span class="bad">멀쩡한 서버가 메모리 부족으로 보입니다.</span></p></div><p class="sub">리눅스는 남는 메모리를 캐시로 쓰기 때문에 <strong>free는 원래 작습니다.</strong></p><table class="compare"><tr><th>메트릭</th><th>뜻</th></tr><tr><td><code>node_memory_MemTotal_bytes</code></td><td>설치된 총 메모리</td></tr><tr><td class="ok"><code>node_memory_MemAvailable_bytes</code></td><td><span class="accent">쓸 수 있는</span> 메모리 — free + 회수 가능분</td></tr><tr><td><code>node_memory_MemFree_bytes</code></td><td>즉시 쓸 수 있는 free만</td></tr></table><p class="callout">대시보드와 임계값에는 <code>MemAvailable</code>을 씁니다. <code>MemFree</code>는 캐시로 쓰이는 메모리를 <span class="bad">부족한 것으로 잘못 셉니다.</span></p>','08-01 §3 meminfo collector','메모리'],
['수집','ch8','<h2>스크레이프가 느리면 duration부터 봅니다</h2><div class="intro-block"><p class="lead">앞 장의 <span class="accent">"가장 느린 하나"</span>를 실제로 찾아내는 방법입니다.</p></div><p class="sub">collector별 소요 시간이 메트릭으로 나옵니다.</p><code class="big-code">node_scrape_collector_duration_seconds</code><div class="grid2"><div class="card"><h3>먼저 볼 것</h3><p><code>scrape_timeout</code>에 가까운 collector <strong>하나</strong>를 찾습니다. 느리면 <code>--no-collector.&lt;이름&gt;</code>으로 끕니다.</p></div><div class="card"><h3>오해하기 쉬운 것</h3><p><code>node_scrape_collector_success=0</code>은 실패가 아니라 <strong>하드웨어 부재</strong>일 수 있습니다. 그 장비에 없는 항목이면 정상입니다.</p></div></div><p class="callout">전부 켜 두는 것이 항상 옳지는 않습니다. <span class="accent">쓰지 않는 collector는 끄는 것</span>이 스크레이프 시간을 줄이는 가장 단순한 방법입니다.</p>','08-01 §5 트러블슈팅 · duration vs success','타임아웃'],
['수집','ch8','<h2>textfile collector는 짧은 작업의 기록을 노출합니다</h2><div class="intro-block"><p class="lead">긁으러 왔을 때 <span class="accent">이미 끝나 있는 작업</span>의 결과를 남기는 방법입니다.</p></div><p class="sub">파일을 <strong>중간 보관소</strong>로 씁니다. 작업은 쓰고, Node Exporter는 읽습니다.</p><svg class="viz" style="width:100%;height:314px" viewBox="-4 -4 1160 316" role="img"><title>textfile collector 흐름</title><desc>짧은 작업이 .prom 파일을 남기고, Node Exporter 가 스크레이프 때 그 디렉토리를 읽어 metrics 에 합쳐 노출합니다.</desc><defs><marker id="t1" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6z" fill="#d4a853"/></marker><marker id="t2" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6z" fill="#ef6a63"/></marker></defs><text x="8" y="20" fill="#ef6a63" font-size="16" font-weight="700">문제 — 짧은 작업은 긁힐 때 이미 없습니다</text><rect x="8" y="34" width="180" height="62" rx="10" fill="#1a1a1a" stroke="#ef6a63" stroke-width="2"/><text x="98" y="60" fill="#e8e4df" font-size="16" text-anchor="middle">백업 · 배치 작업</text><text x="98" y="82" fill="#aaa39c" font-size="16" text-anchor="middle">3초 만에 끝남</text><path d="M188 65H240" stroke="#ef6a63" stroke-width="3" marker-end="url(#t2)"/><rect x="250" y="34" width="200" height="62" rx="10" fill="#241615" stroke="#ef6a63" stroke-width="2"/><text x="350" y="60" fill="#ef6a63" font-size="16" text-anchor="middle">Prometheus 도착</text><text x="350" y="82" fill="#aaa39c" font-size="16" text-anchor="middle">15초 뒤 — 이미 종료</text><text x="470" y="60" fill="#ef6a63" font-size="16">긁을 대상이 없습니다.</text><text x="470" y="82" fill="#aaa39c" font-size="16">그 작업의 결과는 어디에도 남지 않습니다.</text><path d="M8 116H1150" stroke="#2a2520" stroke-width="1"/><text x="8" y="146" fill="#66bb6a" font-size="16" font-weight="700">해법 — 파일에 적어 두고 대신 읽게 합니다</text><rect x="8" y="162" width="176" height="76" rx="10" fill="#1a1a1a" stroke="#72a7d8" stroke-width="3"/><text x="96" y="192" fill="#72a7d8" font-size="16" font-weight="700" text-anchor="middle">① cron 작업</text><text x="96" y="216" fill="#e8e4df" font-size="16" text-anchor="middle">끝나며 결과를 씀</text><path d="M184 200H236" stroke="#d4a853" stroke-width="3" marker-end="url(#t1)"/><rect x="246" y="162" width="228" height="76" rx="10" fill="#1a1a1a" stroke="#d4a853" stroke-width="3"/><text x="360" y="192" fill="#d4a853" font-size="16" font-weight="700" text-anchor="middle">② <tspan font-family="ui-monospace,monospace">.prom</tspan> 파일</text><text x="360" y="216" fill="#e8e4df" font-size="16" text-anchor="middle">textfile.directory 안에</text><path d="M474 200H526" stroke="#d4a853" stroke-width="3" marker-end="url(#t1)"/><rect x="536" y="162" width="228" height="76" rx="10" fill="#d4a853"/><text x="650" y="192" fill="#0d0d0d" font-size="16" font-weight="700" text-anchor="middle">③ Node Exporter</text><text x="650" y="216" fill="#0d0d0d" font-size="16" text-anchor="middle">스크레이프 때 파일을 읽음</text><path d="M764 200H816" stroke="#d4a853" stroke-width="3" marker-end="url(#t1)"/><rect x="826" y="162" width="200" height="76" rx="10" fill="#1a1a1a" stroke="#66bb6a" stroke-width="3"/><text x="926" y="192" fill="#66bb6a" font-size="16" font-weight="700" text-anchor="middle">④ /metrics</text><text x="926" y="216" fill="#e8e4df" font-size="16" text-anchor="middle">node 메트릭과 함께</text><text x="8" y="272" fill="#aaa39c" font-size="16">작업이 죽어 파일이 갱신되지 않아도 <tspan fill="#ef6a63" font-weight="700">옛 값은 계속 노출됩니다</tspan> — 그래서 <tspan fill="#d4a853" font-family="ui-monospace,monospace">node_textfile_mtime_seconds</tspan> 로 파일이 오래됐는지 함께 감시합니다.</text></svg><p class="lab"><strong>실습 관찰</strong> · 잘못된 파일은 <code>node_textfile_scrape_error=1</code>로 드러났지만 다른 node 메트릭은 계속 수집됐습니다.</p>','08-01 §4 textfile collector · notification-lab 2026-07-28','단명 작업'],
['수집','ch8','<h2>복습: exporter를 의심하는 순서</h2><div class="intro-block"><p class="lead">스크레이프가 이상할 때 <span class="accent">무엇부터 열어 볼지</span>를 정해 둡니다.</p></div><p class="sub">증상마다 먼저 볼 메트릭이 다릅니다.</p><table class="compare"><tr><th>증상</th><th>먼저 볼 것</th></tr><tr><td>스크레이프가 느림 / timeout</td><td><code>collector_duration_seconds</code> 최댓값</td></tr><tr><td>특정 메트릭이 없음</td><td>그 collector가 켜져 있나, <code>success</code></td></tr><tr><td>배치 작업 기록이 안 보임</td><td><code>textfile</code> 디렉토리와 <code>mtime</code></td></tr><tr><td>메모리가 부족해 보임</td><td><code>MemFree</code>를 보고 있진 않은가</td></tr></table><p class="question">전체 스크레이프 시간이 3초입니다. collector가 45개일 때 평균 소요는?</p><p class="answer">정답: 평균을 구할 수 없습니다. 병렬이라 3초는 <span class="accent">가장 느린 하나</span>의 시간입니다.</p>','08-01 §5 트러블슈팅 종합','회상'],
['저장','divider','<p class="tag">STEP 2 / 4</p><h1>저장 — 그 값이<br><span class="accent">어떤 모양으로 쌓이는가</span></h1><p class="lead">시계열로 저장한다 → 질의한다</p><div><span class="pill">메트릭·라벨·샘플</span><span class="pill">WAL · head · block</span><span class="pill">인덱스 · 컴팩션</span><span class="pill">PromQL</span></div>','03-01 ~ 03-04','저장 시작','title-slide'],
['저장','ch3','<h2>라벨 전체가 시계열 하나를 정합니다</h2><div class="intro-block"><p class="lead">시계열 하나를 정하는 것은 이름이 아니라 <span class="accent">라벨 전체</span>입니다.</p></div><p class="sub">라벨은 <strong>검색 조건이면서 동시에 비용</strong>입니다.</p><div class="grid3" style="gap:28px"><div class="card"><h3>메트릭</h3><p>무엇을 재는가<br><code>requests_total</code></p></div><div class="card"><h3>시계열</h3><p>이름 + <strong>라벨 전체</strong><br><code>{job="api",method="GET"}</code></p></div><div class="card"><h3>샘플</h3><p>특정 시각의 값<br><code>12:00 → 842</code></p></div></div><div class="intro-block"><p class="lead"><code>http_requests_total{method="GET",status="200"}</code></p></div><div class="grid2"><div class="card"><h3>좋은 라벨</h3><p>값 종류가 제한적이고 실제로 질문에 씁니다. <code>method</code>, <code>status</code>, <code>job</code></p></div><div class="card"><h3>위험한 라벨</h3><p class="bad">값이 계속 새로 생깁니다.</p><p><code>user_id</code>, <code>request_id</code>, <code>trace_id</code></p><p class="muted">사용자 100만 명이면 <strong>시계열 100만 개</strong> — 카디널리티 비용입니다.</p></div></div>','03-01 §1 데이터 모델 3층 · §라벨 셋 · 07-01 §카디널리티','데이터 모델'],
['저장','ch3','<h2>블록 하나가 홀로 서는 작은 데이터베이스입니다</h2><div class="intro-block"><p class="lead">네 조각이 <span class="accent">한 디렉토리에</span> 모여, 다른 블록에 기대지 않고 독립합니다.</p></div><p class="sub">추상이 아니라 <strong>눈에 보이는 파일</strong>입니다. 디렉토리 이름은 ULID라 <strong>사전순이 곧 시간순</strong>입니다.</p><div class="grid2"><div><code class="big-code">/prometheus/data/\n├── 01KYPGY9S4SSXES2Y1WVAW82V0/\n│   ├── index          199,817 B\n│   ├── chunks/000001  333,513 B\n│   ├── meta.json          697 B\n│   └── tombstones           9 B\n├── 01KYQ8M2T1F9RA7X0BNCDE4H3K/\n│   └── ...  ← 블록마다 같은 네 조각\n└── wal/</code></div><div><table class="compare"><tr><th>조각</th><th>무엇이 들었나</th></tr><tr><td><code>index</code></td><td>라벨에서 chunk 위치를 찾는 역색인</td></tr><tr><td><code>chunks/</code></td><td>압축된 실제 샘플</td></tr><tr><td><code>meta.json</code></td><td>시간 범위·샘플 수 통계</td></tr><tr><td><code>tombstones</code></td><td>지울 구간 표시<br><span class="muted">지운 게 없어도 파일은 있음</span></td></tr></table><p class="note">블록끼리 서로를 <strong>가리키지 않습니다.</strong> 그래서 보존 만료가 디렉토리째 삭제로 끝납니다.</p></div></div>','03-03 §1 블록과 chunk — 불변이 모든 것을 결정합니다','저장 구조'],
['저장','ch3','<h2>타입은 관측 하나가 시계열 몇 개가 되는지를 정합니다</h2><div class="intro-block"><p class="lead">타입은 저장 방식을 바꾸지 않지만 <span class="accent">어떤 PromQL 함수를 쓸 수 있는지</span>를 정합니다.</p></div><p class="sub"><code>/metrics</code>에는 <strong>타입이 주석으로 함께</strong> 실려 나옵니다. 값만 오는 게 아닙니다.</p><div class="grid2"><div><code class="big-code"># HELP http_requests_total 총 요청 수\n# TYPE http_requests_total counter\nhttp_requests_total{method="GET"} 1027\n\n# HELP node_memory_MemFree_bytes 여유 메모리\n# TYPE node_memory_MemFree_bytes gauge\nnode_memory_MemFree_bytes 2.03e+09</code></div><div><table class="compare"><tr><th>타입</th><th>관측 1개 → 시계열</th><th>값의 움직임</th></tr><tr><td>Counter</td><td>1개</td><td>오르기만</td></tr><tr><td>Gauge</td><td>1개</td><td>오르내림</td></tr><tr><td>Histogram</td><td class="accent"><strong>버킷 수 + 2</strong></td><td>버킷마다 카운터</td></tr><tr><td>Summary</td><td class="accent"><strong>분위수 개수</strong></td><td>관측마다 재계산</td></tr></table></div></div><p class="callout">TSDB는 타입을 <span class="bad">저장하지 않습니다.</span> 어떤 타입이든 디스크에는 <span class="accent">(시각, 실수) 쌍</span>으로 똑같이 쌓입니다. 타입은 <strong>읽는 쪽 약속</strong>이라, <code>rate()</code>를 게이지에 써도 막아 주지 않습니다.</p>','03-01 §2 메트릭 타입 네 가지','타입'],
['저장','ch3','<h2>샘플 하나는 WAL과 head로 동시에 갑니다</h2><div class="intro-block"><p class="lead">샘플 하나는 <span class="accent">WAL과 head 두 곳으로</span> 동시에 갑니다.</p></div><p class="sub">WAL은 <strong>내구성</strong>을, head는 <strong>조회 속도</strong>를 맡습니다.</p><svg class="viz" viewBox="0 0 1050 300" role="img"><title>TSDB 쓰기 경로</title><desc>스크레이프 샘플이 WAL에 먼저 기록되고 head를 거쳐 영속 블록이 됩니다.</desc><defs><marker id="a7" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6z" fill="#d4a853"/></marker></defs><rect x="20" y="100" width="150" height="80" rx="12" fill="#d4a853"/><text x="95" y="133" fill="#0d0d0d" text-anchor="middle" font-size="19" font-weight="700">스크레이프</text><text x="95" y="159" fill="#0d0d0d" text-anchor="middle" font-size="16">샘플 1개</text><path d="M170 140H265V62H350" fill="none" stroke="#d4a853" stroke-width="4" marker-end="url(#a7)"/><path d="M265 140V222H350" fill="none" stroke="#d4a853" stroke-width="4" marker-end="url(#a7)"/><rect x="360" y="22" width="250" height="82" rx="12" fill="#1a1a1a" stroke="#66bb6a" stroke-width="3"/><text x="485" y="56" fill="#66bb6a" text-anchor="middle" font-size="20" font-weight="700">1. WAL</text><text x="485" y="82" fill="#e8e4df" text-anchor="middle" font-size="16">재시작 복구용</text><rect x="360" y="182" width="250" height="82" rx="12" fill="#1a1a1a" stroke="#72a7d8" stroke-width="3"/><text x="485" y="216" fill="#72a7d8" text-anchor="middle" font-size="20" font-weight="700">2. head</text><text x="485" y="242" fill="#e8e4df" text-anchor="middle" font-size="16">메모리 · 현재 구간</text><path d="M610 222H735" stroke="#d4a853" stroke-width="4" marker-end="url(#a7)"/><text x="672" y="210" fill="#aaa39c" text-anchor="middle" font-size="16">2시간마다</text><rect x="745" y="182" width="255" height="82" rx="12" fill="#1a1a1a" stroke="#d4a853" stroke-width="3"/><text x="872" y="216" fill="#d4a853" text-anchor="middle" font-size="20" font-weight="700">3. 영속 블록</text><text x="872" y="242" fill="#e8e4df" text-anchor="middle" font-size="16">디스크 · 불변</text></svg><p class="lab"><strong>▶ 여기서 시연</strong> · <code>02-01.스크레이프와 저장 흐름.html</code>을 열어 단계를 넘겨 가며 봅니다.</p>','03-02 §2 샘플 하나가 걸어가는 길 · 인라인 SVG','쓰기 경로'],
['저장','ch3','<h2>WAL은 아직 블록이 아닌 데이터를 지킵니다</h2><div class="intro-block"><p class="lead">head는 메모리에 있습니다. <span class="accent">재시작하면 사라지는데도</span> 데이터가 남는 이유가 WAL입니다.</p></div><p class="sub">복구는 <strong>디스크에 남은 것부터 차례로 되살리는</strong> 세 단계입니다.</p><svg class="viz" style="width:100%;height:405px" viewBox="-4 -4 1160 408" role="img"><title>재시작 복구 3단계</title><desc>재시작하면 디스크에 남은 것부터 되살리고, 체크포인트로 건너뛴 뒤, 그 이후 WAL 만 재생해 head 를 복원합니다.</desc><defs><marker id="r9" markerWidth="7" markerHeight="7" refX="6.5" refY="2.4" orient="auto"><path d="M0 0L7 2.4L0 4.8z" fill="#d4a853"/></marker></defs><rect x="8" y="16" width="1144" height="76" rx="10" fill="#241615" stroke="#ef6a63" stroke-width="2"/><text x="28" y="48" fill="#ef6a63" font-size="17" font-weight="700">재시작 직후 — 메모리의 head 가 통째로 사라진 상태</text><text x="28" y="78" fill="#e8e4df" font-size="16">디스크에는 WAL 과 이미 flush 된 chunk 가 남아 있습니다. 이것만으로 되돌립니다.</text><rect x="8" y="116" width="360" height="120" rx="10" fill="#1a1a1a" stroke="#72a7d8" stroke-width="3"/><text x="28" y="152" fill="#72a7d8" font-size="17" font-weight="700">① 디스크의 chunk 를 먼저 붙입니다</text><text x="28" y="186" fill="#e8e4df" font-size="16">이미 flush 돼 파일로 있는 것들</text><text x="28" y="216" fill="#aaa39c" font-size="16">읽을 필요 없이 위치만 연결 (mmap)</text><path d="M368 176H414" stroke="#d4a853" stroke-width="3" marker-end="url(#r9)"/><rect x="424" y="116" width="360" height="120" rx="10" fill="#1a1a1a" stroke="#d4a853" stroke-width="3"/><text x="444" y="152" fill="#d4a853" font-size="17" font-weight="700">② 체크포인트를 재생합니다</text><text x="444" y="186" fill="#e8e4df" font-size="16">오래된 WAL 을 미리 요약해 둔 것</text><text x="444" y="216" fill="#aaa39c" font-size="16">쓸모없어진 기록은 이미 걸러져 있음</text><path d="M784 176H830" stroke="#d4a853" stroke-width="3" marker-end="url(#r9)"/><rect x="840" y="116" width="312" height="120" rx="10" fill="#1a1a1a" stroke="#66bb6a" stroke-width="3"/><text x="860" y="152" fill="#66bb6a" font-size="17" font-weight="700">③ 그 뒤 WAL 만 재생합니다</text><text x="860" y="186" fill="#e8e4df" font-size="16">체크포인트 이후에 들어온 샘플</text><text x="860" y="216" fill="#aaa39c" font-size="16">여기까지 하면 head 가 원상복구</text><rect x="8" y="268" width="1144" height="132" rx="10" fill="#141b22" stroke="#72a7d8" stroke-width="2"/><text x="28" y="306" fill="#72a7d8" font-size="17" font-weight="700">체크포인트가 없으면 어떻게 되나</text><text x="28" y="346" fill="#d9e8f5" font-size="16">WAL 을 처음부터 전부 다시 읽어야 합니다. 저자는 예전 버전에서 재생이 30분을 넘는 것을 드물지 않게 봤고,</text><text x="28" y="380" fill="#d9e8f5" font-size="16">최적화 뒤 같은 서버가 5분 안팎에 끝난다고 적습니다. 그동안 이 Prometheus 는 질의를 받지 못합니다.</text></svg>','03-02 §3 WAL · 재시작 복구','WAL'],
['저장','ch3','<h2>인덱스는 라벨에서 샘플까지 세 단을 거칩니다</h2><div class="intro-block"><p class="lead">질의에 적힌 <span class="accent">라벨과 시간 범위</span>가 각 단계에서 쓰입니다.</p></div><svg class="viz" style="width:100%;height:441px" viewBox="-4 -4 1160 444" role="img"><title>인덱스가 질의를 샘플까지 데려가는 길</title><desc>사용자 질의의 라벨과 시간 범위가 각각 포스팅과 시리즈 항목에 쓰이고, 8바이트 참조가 chunk 파일의 한 지점을 찍습니다.</desc><defs><marker id="x9" markerWidth="7" markerHeight="7" refX="6.5" refY="2.4" orient="auto"><path d="M0 0L7 2.4L0 4.8z" fill="#d4a853"/></marker></defs><text x="8" y="24" fill="#d4a853" font-size="17" font-weight="700">사용자가 던진 질의</text><rect x="8" y="38" width="1144" height="58" rx="10" fill="#211d18" stroke="#d4a853" stroke-width="2"/><text x="32" y="72" fill="#f3d697" font-size="19" font-family="ui-monospace,monospace">node_cpu_seconds_total{job="kubelet", env="prod"}[12:00 ~ 14:00]</text><text x="700" y="72" fill="#aaa39c" font-size="16">← <tspan fill="#d4a853">라벨</tspan>은 ①로, <tspan fill="#66bb6a">시간 범위</tspan>는 ②로 갑니다</text><text x="8" y="132" fill="#d4a853" font-size="17" font-weight="700">① 포스팅 — 질의의 라벨로 시리즈 ID 를 좁힙니다</text><rect x="8" y="148" width="440" height="112" rx="10" fill="#1a1a1a" stroke="#4a443c" stroke-width="2"/><text x="32" y="180" fill="#e8e4df" font-size="17" font-family="ui-monospace,monospace">job="kubelet" → [10, 11, 17]</text><text x="32" y="212" fill="#e8e4df" font-size="17" font-family="ui-monospace,monospace">env="prod"    → [7, 9, 11, 13, 17]</text><text x="32" y="244" fill="#66bb6a" font-size="17" font-weight="700" font-family="ui-monospace,monospace">교집합 → [11, 17]</text><path d="M448 204H500" stroke="#d4a853" stroke-width="3" marker-end="url(#x9)"/><text x="510" y="132" fill="#d4a853" font-size="17" font-weight="700">② ID 11 의 항목 — 이 블록 안 chunk 들의 목록</text><rect x="510" y="148" width="642" height="112" rx="10" fill="#1a1a1a" stroke="#4a443c" stroke-width="2"/><text x="534" y="176" fill="#aaa39c" font-size="16">블록 하나에 이 시계열의 chunk 가 여러 개 있고, 각각 <tspan fill="#d4a853" font-weight="700">담당 시간대</tspan>가 다릅니다</text><rect x="534" y="190" width="176" height="52" rx="7" fill="#211d18" stroke="#4a443c" stroke-width="1"/><text x="622" y="212" fill="#e8e4df" font-size="16" text-anchor="middle" font-family="ui-monospace,monospace">10:00~12:00</text><text x="622" y="232" fill="#aaa39c" font-size="16" text-anchor="middle">건너뜀</text><rect x="722" y="190" width="176" height="52" rx="7" fill="#1c2a1e" stroke="#66bb6a" stroke-width="2"/><text x="810" y="212" fill="#e8e4df" font-size="16" text-anchor="middle" font-family="ui-monospace,monospace">12:00~14:00</text><text x="810" y="232" fill="#66bb6a" font-size="16" text-anchor="middle">질의와 겹침 → 읽음</text><rect x="910" y="190" width="176" height="52" rx="7" fill="#211d18" stroke="#4a443c" stroke-width="1"/><text x="998" y="212" fill="#e8e4df" font-size="16" text-anchor="middle" font-family="ui-monospace,monospace">14:00~16:00</text><text x="998" y="232" fill="#aaa39c" font-size="16" text-anchor="middle">건너뜀</text><path d="M810 260V300" stroke="#66bb6a" stroke-width="3" marker-end="url(#x9)"/><text x="8" y="332" fill="#d4a853" font-size="17" font-weight="700">③ 그 chunk 를 가리키는 값이 8바이트짜리 정수 하나입니다</text><text x="600" y="332" fill="#aaa39c" font-size="16">— 이 값은 <tspan fill="#66bb6a" font-weight="700">인덱스에 이미 적혀 있습니다</tspan> (찾는 게 아닙니다)</text><rect x="8" y="348" width="560" height="72" rx="10" fill="#1a1a1a" stroke="#4a443c" stroke-width="2"/><rect x="28" y="368" width="250" height="34" rx="6" fill="#211d18" stroke="#4a443c" stroke-width="1"/><text x="153" y="391" fill="#e8e4df" font-size="16" text-anchor="middle">앞 4바이트 — 몇 번 파일</text><rect x="298" y="368" width="250" height="34" rx="6" fill="#211d18" stroke="#4a443c" stroke-width="1"/><text x="423" y="391" fill="#e8e4df" font-size="16" text-anchor="middle">뒤 4바이트 — 파일 안 위치</text><path d="M568 384H620" stroke="#d4a853" stroke-width="3" marker-end="url(#x9)"/><rect x="630" y="348" width="522" height="72" rx="10" fill="#1a1a1a" stroke="#66bb6a" stroke-width="2"/><text x="654" y="378" fill="#e8e4df" font-size="17" font-family="ui-monospace,monospace">블록의 chunks/000001 을 열고 970 바이트로 점프</text><text x="654" y="404" fill="#aaa39c" font-size="16">거기서 길이만큼 잘라내면 그 chunk 가 나옵니다</text></svg><p class="note"><strong>chunks/ 안에는 파일이 여러 개입니다</strong> — 세그먼트가 커지면 <code>000001</code>, <code>000002</code> … 로 늘어납니다. 그래서 "몇 번 파일"이 따로 필요합니다. 인덱스와 chunk 파일은 <strong>같이 만들어져</strong>, 쓰는 시점에 위치를 적어 둡니다. 이 주소는 <span class="accent">그 블록 안에서만</span> 유효합니다.</p>','03-03 §2 인덱스 — 역색인이 질의를 이끕니다','인덱스'],
['저장','ch3','<h2>컴팩션은 합치는 게 아니라 새로 쓰는 것입니다</h2><div class="intro-block"><p class="lead">작은 블록을 <span class="accent">고쳐서 붙이지 않습니다.</span> 읽어서 새 블록을 만들고, 원본을 지웁니다.</p></div><p class="sub">그렇게 잘 합쳐 두어도 <strong>보존 기간이 지나면 폴더째 지웁니다.</strong> 왜 지워야 할까요.</p><svg class="viz" style="width:100%;height:401px" viewBox="-4 -4 1160 404" role="img"><title>컴팩션과 장기보존</title><desc>작은 블록을 읽어 새 블록을 만들고 원본을 지우며, 보존 기간이 지나면 삭제되므로 오래 보려면 밖으로 내보내야 합니다.</desc><defs><marker id="c1" markerWidth="7" markerHeight="7" refX="6.5" refY="2.4" orient="auto"><path d="M0 0L7 2.4L0 4.8z" fill="#d4a853"/></marker></defs><text x="8" y="24" fill="#d4a853" font-size="17" font-weight="700">컴팩션 — 원본은 읽기만 하고, 새로 씁니다</text><rect x="8" y="40" width="132" height="62" rx="8" fill="#1a1a1a" stroke="#4a443c" stroke-width="2"/><text x="74" y="68" fill="#e8e4df" font-size="16" text-anchor="middle">블록 A</text><text x="74" y="90" fill="#aaa39c" font-size="16" text-anchor="middle">2시간</text><rect x="150" y="40" width="132" height="62" rx="8" fill="#1a1a1a" stroke="#4a443c" stroke-width="2"/><text x="216" y="68" fill="#e8e4df" font-size="16" text-anchor="middle">블록 B</text><text x="216" y="90" fill="#aaa39c" font-size="16" text-anchor="middle">2시간</text><rect x="292" y="40" width="132" height="62" rx="8" fill="#1a1a1a" stroke="#4a443c" stroke-width="2"/><text x="358" y="68" fill="#e8e4df" font-size="16" text-anchor="middle">블록 C</text><text x="358" y="90" fill="#aaa39c" font-size="16" text-anchor="middle">2시간</text><path d="M424 71H476" stroke="#d4a853" stroke-width="3" marker-end="url(#c1)"/><rect x="486" y="32" width="252" height="78" rx="10" fill="#d4a853"/><text x="612" y="62" fill="#0d0d0d" font-size="17" font-weight="700" text-anchor="middle">새 블록 D 를 통째로 씀</text><text x="612" y="88" fill="#0d0d0d" font-size="16" text-anchor="middle">새 ULID · 새 index · 새 chunks</text><path d="M738 71H790" stroke="#d4a853" stroke-width="3" marker-end="url(#c1)"/><rect x="800" y="32" width="230" height="78" rx="10" fill="#1a1a1a" stroke="#4a443c" stroke-width="2"/><text x="915" y="62" fill="#e8e4df" font-size="17" text-anchor="middle">A · B · C 삭제</text><text x="915" y="88" fill="#aaa39c" font-size="16" text-anchor="middle">쓰기가 끝난 뒤에</text><text x="8" y="140" fill="#aaa39c" font-size="16">기존 파일을 고치면 오프셋이 어긋나 <tspan fill="#ef6a63">읽는 중인 질의가 깨집니다.</tspan> 새로 쓰고 마지막에 갈아 끼우면 그 위험이 없습니다.</text><path d="M8 164H1152" stroke="#2a2520" stroke-width="1"/><text x="8" y="196" fill="#66bb6a" font-size="17" font-weight="700">그런데 컴팩션을 해도 디스크는 계속 늘어납니다</text><rect x="8" y="212" width="470" height="110" rx="10" fill="#1a1a1a" stroke="#4a443c" stroke-width="2"/><text x="32" y="242" fill="#d4a853" font-size="17" font-weight="700">컴팩션이 줄이는 것 : 중복된 인덱스</text><text x="32" y="268" fill="#e8e4df" font-size="16">2시간 블록마다 같은 라벨 목록이 반복됩니다.</text><text x="32" y="292" fill="#ef6a63" font-size="17" font-weight="700">줄이지 못하는 것 : 샘플 그 자체</text><text x="32" y="314" fill="#aaa39c" font-size="16">15초마다 찍힌 값은 합쳐도 그대로 남습니다.</text><path d="M478 267H530" stroke="#ef6a63" stroke-width="3" marker-end="url(#c1)"/><rect x="540" y="212" width="612" height="110" rx="10" fill="#241615" stroke="#ef6a63" stroke-width="2"/><text x="564" y="242" fill="#ef6a63" font-size="17" font-weight="700">그래서 안 지우면 디스크가 찹니다</text><text x="564" y="268" fill="#e8e4df" font-size="16">Prometheus 는 서버 한 대의 로컬 디스크에 씁니다. 무한하지 않습니다.</text><text x="564" y="292" fill="#e8e4df" font-size="16">게다가 컴팩션은 <tspan fill="#d4a853" font-weight="700">원본과 새 블록을 잠시 같이 들고 있습니다.</tspan></text><text x="564" y="314" fill="#aaa39c" font-size="16">공식 문서가 보존 크기를 가용 디스크의 80~85% 이하로 권하는 이유입니다.</text><text x="8" y="356" fill="#aaa39c" font-size="17">그리고 <tspan fill="#d4a853" font-weight="700">한 달 전 15초 단위 값을 볼 일은 드뭅니다.</tspan> 오래된 데이터는 가치가 빨리 떨어집니다.</text><text x="8" y="386" fill="#aaa39c" font-size="17">그래도 남겨야 한다면 <tspan fill="#66bb6a" font-weight="700">지우기 전에 밖으로 내보냅니다</tspan> — Thanos 가 새 블록을 S3 로 올리고, 질의 때 로컬과 합쳐 보여 줍니다.</text></svg>','03-03 §3 컴팩션과 보존 · §4 장기보존','수명주기'],
['조회','divider','<p class="tag">STEP 3 / 4</p><h1>조회 — 쌓인 값을<br><span class="accent">어떻게 읽는가</span></h1><p class="lead">질의한다 → 그래프가 된다</p><div><span class="pill">순간 · 범위 벡터</span><span class="pill">rate</span><span class="pill">집계 by / without</span><span class="pill">staleness</span><span class="pill">실전 질의</span></div>','03-04 PromQL 기초','조회 시작','title-slide'],
['조회','ch3','<h2>대괄호 하나가 순간과 범위를 가릅니다</h2><div class="intro-block"><p class="lead">PromQL은 <span class="accent">시계열 묶음을 다루는 언어</span>입니다. 값 하나가 아니라 여러 시계열이 한꺼번에 나옵니다.</p></div><p class="sub">함수마다 <strong>어느 쪽을 받는지</strong>가 정해져 있어, 이 구분이 문법 오류의 절반입니다.</p><div class="grid2"><div class="card"><h3>순간 벡터 <code>up</code></h3><p>시계열마다 <strong>지금 값 하나</strong></p><p class="muted">up{instance="a"} 1<br>up{instance="b"} 0</p></div><div class="card"><h3>범위 벡터 <code>up[5m]</code></h3><p>시계열마다 <strong>지난 5분의 값들</strong></p><p class="muted">그래프로 바로 못 그립니다. 함수로 하나의 값으로 접어야 합니다.</p></div></div><p class="callout"><code>rate()</code>·<code>increase()</code> 같은 함수는 <span class="accent">범위 벡터만</span> 받습니다. <code>rate(up)</code>은 오류이고 <code>rate(up[5m])</code>이 맞습니다.</p>','03-04 §2 순간 벡터와 범위 벡터 — 대괄호가 경계입니다','벡터 타입'],
['조회','ch3','<h2><code>rate()</code>는 누적값을 속도로 바꿉니다</h2><div class="intro-block"><p class="lead">카운터는 계속 커지기만 해서 <span class="accent">값 자체는 의미가 없습니다.</span> 초당 얼마나 늘었는지가 궁금한 것입니다.</p></div><p class="sub">같은 뼈대에서 <strong>시간으로 나누느냐</strong>만 다른 함수들이 갈라져 나옵니다.</p><code class="big-code">rate     = (마지막 − 처음) ÷ 경과 시간     ← 초당 증가량\nincrease =  마지막 − 처음                 ← 기간 내 증가분\nirate    = (마지막 − 직전) ÷ 그 간격      ← 최근 두 점만</code><div class="grid2"><div class="card"><h3>보통은 <code>rate</code></h3><p><code>irate</code>는 최근 두 점만 보므로 범위를 늘려도 결과가 거의 같습니다. <strong>빠르게 출렁이는 시계열</strong>에만 씁니다.</p></div><div class="card"><h3 class="bad">게이지에 쓰면 틀립니다</h3><p><code>rate</code>·<code>increase</code>는 <strong>값이 늘기만 한다</strong>고 전제합니다. 메모리처럼 오르내리는 값에 쓰면 엉뚱한 수가 나옵니다.</p></div></div>','03-04 §9 함수 다섯 개면 대부분 됩니다','rate'],
['조회','ch3','<h2>집계는 시계열을 접어 개수를 줄입니다</h2><div class="intro-block"><p class="lead">인스턴스마다 나오는 수십 개 시계열을 <span class="accent">보고 싶은 단위로</span> 합칩니다.</p></div><p class="sub">계산은 <code>sum</code>·<code>avg</code>가 합니다. <code>by</code>·<code>without</code>은 <strong>어느 라벨을 남길지</strong>만 정합니다.</p><code class="big-code">sum by (service) (rate(http_requests_total[5m]))\n\n집계 전 4개 → {service="order-api"} 2.76\n            {service="payment-api"} 1.49</code><div class="grid2"><div class="card"><h3><code>by</code> — 남길 것을 적음</h3><p>닫힌 목록입니다. 새 라벨이 생겨도 <strong>결과가 그대로</strong>라 변화에 강합니다.</p></div><div class="card"><h3><code>without</code> — 버릴 것을 적음</h3><p>열린 목록입니다. 새 라벨이 생기면 <span class="bad">결과가 쪼개집니다.</span></p></div></div>','03-04 §6 연산자 — 산술, 집계, 그리고 조인','집계'],
['조회','ch3','<h2>그래프의 구멍은 대개 staleness입니다</h2><div class="intro-block"><p class="lead">질의는 <span class="accent">5분</span>(<code>lookback delta</code>)을 거슬러 값을 찾고, 못 찾으면 시계열이 사라진 것처럼 보입니다.</p></div><p class="sub"><strong>staleness</strong>: 마지막 샘플이 <span class="accent">너무 오래돼 더는 유효하지 않다</span>고 보는 상태입니다. 사라져 보이는 경우는 셋입니다.</p><div class="grid3"><div class="card"><h3>① 5분간 샘플 없음</h3><p>lookback delta 기본값을 넘겼습니다. 스크레이프 주기가 <strong>5분보다 길면</strong> 정상인데도 구멍이 납니다.</p></div><div class="card"><h3>② 직전에 있던 게 없어짐</h3><p>이번 스크레이프에 빠지면 <strong>staleness 마커</strong>가 삽입됩니다. 조건부 등록이 여기 해당합니다.</p></div><div class="card"><h3>③ 대상이 사라짐</h3><p>파드가 삭제돼 감시 목록에서 빠졌습니다. 마지막 값 시각이 <strong>빠진 시점</strong>과 얼추 맞습니다.</p></div></div><table class="compare"><tr><th>화면</th><th>실제 상황</th><th>해야 할 일</th></tr><tr><td>선 없음</td><td>그 사유의 실패가 <span class="ok">0건</span></td><td class="muted">아무것도 안 해도 됨</td></tr><tr><td>선 없음</td><td class="bad">앱이 죽어 메트릭을 못 냄</td><td class="bad">지금 대응</td></tr></table><p class="callout">값이 0이어도 계속 내보내야 둘이 갈립니다 — <span class="accent">0인 평평한 선이 "살아 있다"는 신호</span>입니다.</p>','03-04 §5 staleness — 그래프의 구멍은 대개 이것입니다','staleness'],
['조회','ch3','<h2>배운 것을 붙이면 실제 질의가 됩니다</h2><div class="intro-block"><p class="lead">앞에서 본 <span class="accent">Node Exporter의 CPU 값</span>을 실제로 읽어 봅니다.</p></div><p class="sub">CPU는 백분율이 아니라 <strong>각 모드에서 보낸 초</strong>로 나옵니다.</p><code class="big-code">sum without (cpu, mode) (\n  rate(node_cpu_seconds_total{mode!="idle"}[5m])\n)</code><div class="grid3"><div class="card"><h3>범위 벡터</h3><p><code>[5m]</code>으로 지난 5분을 뜹니다.</p></div><div class="card"><h3>rate</h3><p>누적 초를 <strong>초당 사용량</strong>으로 바꿉니다.</p></div><div class="card"><h3>집계</h3><p><code>cpu</code>·<code>mode</code>를 접어 서버 단위로 합칩니다.</p></div></div><p class="callout">결과는 CPU가 하나면 최대 <code>1.0</code>, 둘이면 <code>2.0</code>입니다. 0~100%로 보려면 <span class="accent">코어 수로 나눕니다</span> — <code>count without (cpu, mode) (node_cpu_seconds_total{mode="idle"})</code></p>','03-04 §6 집계 · 08-01 §3 cpu collector','실전 질의'],
['알림','divider','<p class="tag">STEP 4 / 4</p><h1>알림 — 조건이 참일 때<br><span class="accent">누구에게 어떻게 닿는가</span></h1><p class="lead">규칙을 평가한다 → 묶어서 보낸다</p><div><span class="pill">inactive · pending · firing</span><span class="pill">그룹핑 · 라우팅</span><span class="pill">억제 · 시간 구간</span><span class="pill">룰 테스트 · HA</span></div>','05-01 · 05-02','알림 시작','title-slide'],
['알림','ch5','<h2>알림은 두 프로그램이 나눠 맡습니다</h2><div class="intro-block"><p class="lead">알림은 <span class="accent">두 프로그램이 나눠</span> 맡습니다. Prometheus는 알림을 <span class="bad">보내지 않습니다.</span></p></div><p class="sub">이 구간의 단 하나의 메시지입니다 — <strong>두 상태는 다른 것</strong>입니다.</p><div class="grid2"><div class="card"><h3>Prometheus</h3><ul><li>PromQL 규칙 평가</li><li>inactive / pending / firing</li><li>firing 알림을 <strong>전달</strong></li></ul></div><div class="card"><h3>Alertmanager</h3><ul><li>그룹핑과 라우팅</li><li>억제와 침묵</li><li>Slack·메일 <strong>발송</strong></li></ul></div></div><p class="lab"><strong>▶ 여기서 시연</strong> · <code>02-02.알림 흐름.html</code> 에서 <code>for</code> 세 시나리오와 그룹핑·억제를 눈으로 비교합니다.</p><p class="callout">이 장의 단 하나의 메시지 — <span class="accent">두 상태는 다른 것입니다.</span> Prometheus는 알림을 <span class="bad">보내지 않습니다.</span></p><p class="lab"><strong>실습 관찰</strong> · Alertmanager를 멈춰도 Prometheus의 firing은 유지됐고 새 통지만 끊겼습니다.</p>','05-01 §1 Prometheus 와 Alertmanager 의 분업 · notification-lab 2026-07-28','책임 분리'],
['알림','ch5','<h2><code>for</code>는 순간 이상과 지속 이상을 가릅니다</h2><div class="intro-block"><p class="lead">조건이 참인 <span class="accent">순간</span>과 <span class="accent">지속</span>은 다릅니다. 그 둘을 가르는 것이 <code>for</code>입니다.</p></div><p class="sub"><code>for</code>를 채우기 전까지는 <strong>pending</strong>이라 Alertmanager는 아직 아무것도 받지 않습니다.</p><svg class="viz" style="width:100%;height:414px" viewBox="-4 -4 1160 417" role="img"><title>for 가 만드는 상태와 그 값을 정하는 기준</title><desc>조건이 참이 되면 pending 으로 들어가고 for 를 채워야 firing 이 되어 Alertmanager 로 넘어갑니다. for 값은 등급별 경험칙과 평가 주기 제약을 따릅니다.</desc><defs><marker id="a20" markerWidth="7" markerHeight="7" refX="6.5" refY="2.4" orient="auto"><path d="M0 0L7 2.4L0 4.8z" fill="#d4a853"/></marker></defs><text x="8" y="24" fill="#72a7d8" font-size="17" font-weight="700">Prometheus 안에서 — 규칙 평가</text><rect x="8" y="42" width="196" height="76" rx="38" fill="#1a1a1a" stroke="#4a443c" stroke-width="3"/><text x="106" y="88" fill="#e8e4df" font-size="19" text-anchor="middle">inactive</text><path d="M204 80H268" stroke="#d4a853" stroke-width="3" marker-end="url(#a20)"/><text x="236" y="66" fill="#aaa39c" font-size="16" text-anchor="middle">조건 참</text><rect x="278" y="42" width="196" height="76" rx="38" fill="#1a1a1a" stroke="#d4a853" stroke-width="3"/><text x="376" y="88" fill="#d4a853" font-size="19" text-anchor="middle">pending</text><path d="M474 80H538" stroke="#d4a853" stroke-width="3" marker-end="url(#a20)"/><text x="506" y="66" fill="#aaa39c" font-size="16" text-anchor="middle">for 충족</text><rect x="548" y="42" width="196" height="76" rx="38" fill="#1a1a1a" stroke="#ef6a63" stroke-width="3"/><text x="646" y="88" fill="#ef6a63" font-size="19" text-anchor="middle">firing</text><path d="M744 80H812" stroke="#d4a853" stroke-width="3" marker-end="url(#a20)"/><rect x="822" y="36" width="330" height="88" rx="10" fill="#1a1a1a" stroke="#66bb6a" stroke-width="3"/><text x="987" y="70" fill="#66bb6a" font-size="18" font-weight="700" text-anchor="middle">Alertmanager</text><text x="987" y="100" fill="#e8e4df" font-size="16" text-anchor="middle">여기서부터 그룹 · 억제 · 발송</text><text x="8" y="150" fill="#aaa39c" font-size="16">조건이 거짓이 되면 pending 은 <tspan fill="#ef6a63" font-weight="700">0 으로 초기화</tspan>됩니다. Alertmanager 는 이 구간을 아예 보지 못합니다.</text><path d="M8 176H1152" stroke="#2a2520" stroke-width="1"/><text x="8" y="208" fill="#d4a853" font-size="17" font-weight="700">그러면 for 를 얼마로 둘까요</text><rect x="8" y="222" width="360" height="88" rx="10" fill="#1a1a1a" stroke="#4a443c" stroke-width="2"/><text x="32" y="250" fill="#d4a853" font-size="17" font-weight="700">warning — 15분보다 짧지 않게</text><text x="32" y="276" fill="#e8e4df" font-size="16">1~2시간짜리도 겁내지 마십시오.</text><text x="32" y="300" fill="#aaa39c" font-size="16">길수록 조용해집니다.</text><rect x="388" y="222" width="360" height="88" rx="10" fill="#1a1a1a" stroke="#4a443c" stroke-width="2"/><text x="412" y="250" fill="#ef6a63" font-size="17" font-weight="700">critical — 15분보다 길지 않게</text><text x="412" y="276" fill="#e8e4df" font-size="16">짧은 값(0m · 5m)은 여기에 씁니다.</text><text x="412" y="300" fill="#aaa39c" font-size="16">빨리 알아야 하는 쪽입니다.</text><rect x="768" y="222" width="384" height="88" rx="10" fill="#1a1a1a" stroke="#4a443c" stroke-width="2"/><text x="792" y="250" fill="#66bb6a" font-size="17" font-weight="700">반대편 손잡이 — keep_firing_for</text><text x="792" y="276" fill="#e8e4df" font-size="16">조건이 거짓이 된 뒤에도 유지합니다.</text><text x="792" y="300" fill="#aaa39c" font-size="16">해소·발화가 번갈아 쏟아지는 것을 막습니다.</text><path d="M8 328H1152" stroke="#2a2520" stroke-width="1"/><text x="8" y="356" fill="#ef6a63" font-size="17" font-weight="700">주의 — 스크레이프가 한 번 실패하면 pending 이 0 으로 돌아갑니다</text><text x="8" y="382" fill="#aaa39c" font-size="17">데이터 공백이 조건을 <tspan fill="#ef6a63" font-weight="700">거짓처럼</tspan> 만듭니다. <tspan fill="#d4a853">last_over_time()</tspan> 으로 짧은 공백을 견딥니다.</text><text x="8" y="406" fill="#aaa39c" font-size="17">for 는 룰 평가 주기보다 길어야 합니다 — 실습에서도 <tspan fill="#d4a853" font-weight="700">for: 10s</tspan> 는 30초 주기에서 바로 firing 됐고, <tspan fill="#d4a853" font-weight="700">for: 2m</tspan> 에서만 pending 이 보였습니다.</text></svg>','05-02 §2 for 기간 · §3 스크레이프 실패가 for 를 지운다 · notification-lab 2026-08-05','상태와 값'],
['알림','ch5','<h2>그룹핑은 폭풍을 한 묶음으로 바꿉니다</h2><div class="intro-block"><p class="lead">알림 100건을 <span class="accent">한 통으로 묶는</span> 것이 그룹핑입니다.</p></div><p class="sub">노드 100대가 한꺼번에 죽으면 메일 100통이 아니라 <strong>한 통</strong>이어야 합니다.</p><div class="grid2"><div><code class="big-code">route:\n  group_by: [alertname, cluster]\n  group_wait:      30s\n  group_interval:   5m\n  repeat_interval:  4h</code></div><div><table class="compare"><tr><th>설정</th><th>언제 쓰이나</th></tr><tr><td><code>group_by</code></td><td>이 라벨이 같으면 <strong>한 묶음</strong></td></tr><tr><td><code>group_wait</code></td><td>첫 알림 뒤 <strong>모으는</strong> 시간</td></tr><tr><td><code>group_interval</code></td><td>그룹에 <strong>변경</strong>이 생겼을 때</td></tr><tr><td><code>repeat_interval</code></td><td><strong>새 발화도 해소도 없을 때</strong> 다시</td></tr></table></div></div><p class="note"><strong>"변화 없어도"가 뜻하는 것</strong> : 마지막 <code>group_interval</code> 이후 <strong>새로 발화하거나 해소된 알림이 하나도 없는</strong> 상태입니다. 값이 그대로 다시 들어오는 것은 변화가 아닙니다. 하나라도 바뀌면 반복 대신 <strong>갱신</strong>이 나갑니다.</p>','05-01 §4 그룹핑 · notification-lab 2026-07-28','그룹핑'],
['알림','ch5','<h2>라우트 트리는 층층이 내려가며 수신자를 정합니다</h2><div class="intro-block"><p class="lead">알림 하나가 트리를 걸어 내려가며 <span class="accent">가장 구체적인 라우트</span>를 찾습니다.</p></div><p class="sub">자식에 걸리면 더 내려가고, <strong>어느 자식에도 안 걸리면 부모로 되돌아옵니다.</strong></p><svg class="viz" style="width:100%;height:357px" viewBox="-4 -4 1160 360" role="img"><title>라우트 트리는 여러 층이고, 지나간 곳이 곧 발송지는 아닙니다</title><desc>최상위 아래로 서브라우트가 층을 이루고, 알림은 가장 구체적인 층까지 내려갑니다. 자식에 걸리면 부모는 경유지가 되고, 자식에 걸리지 않으면 부모로 되돌아옵니다.</desc><defs><marker id="rt" markerWidth="7" markerHeight="7" refX="6.5" refY="2.4" orient="auto"><path d="M0 0L7 2.4L0 4.8z" fill="#d4a853"/></marker><marker id="rt2" markerWidth="7" markerHeight="7" refX="6.5" refY="2.4" orient="auto"><path d="M0 0L7 2.4L0 4.8z" fill="#66bb6a"/></marker></defs><text x="8" y="22" fill="#aaa39c" font-size="16">1층</text><text x="8" y="140" fill="#aaa39c" font-size="16">2층</text><text x="8" y="258" fill="#aaa39c" font-size="16">3층</text><path d="M64 8V286" stroke="#2a2520" stroke-width="1"/><rect x="88" y="8" width="330" height="72" rx="10" fill="#1a1a1a" stroke="#4a443c" stroke-width="2"/><text x="112" y="36" fill="#e8e4df" font-size="17" font-weight="700">route (최상위)</text><text x="112" y="62" fill="#aaa39c" font-size="16">receiver: fallback · 매처 못 가짐</text><path d="M253 80V116" stroke="#d4a853" stroke-width="3" marker-end="url(#rt)"/><rect x="88" y="126" width="330" height="94" rx="10" fill="#1a1a1a" stroke="#d4a853" stroke-width="2"/><text x="112" y="154" fill="#d4a853" font-size="17" font-weight="700">slack-devops</text><text x="112" y="180" fill="#aaa39c" font-size="16">team = devops</text><text x="112" y="204" fill="#66bb6a" font-size="16">continue: true</text><rect x="620" y="126" width="330" height="94" rx="10" fill="#1a1a1a" stroke="#4a443c" stroke-width="2"/><text x="644" y="154" fill="#e8e4df" font-size="17" font-weight="700">default</text><text x="644" y="180" fill="#aaa39c" font-size="16">environment = production</text><text x="644" y="204" fill="#aaa39c" font-size="16">team =~ (devops|sre)</text><path d="M253 220V256" stroke="#d4a853" stroke-width="3" marker-end="url(#rt)"/><rect x="88" y="266" width="330" height="72" rx="10" fill="#1a1a1a" stroke="#ef6a63" stroke-width="2"/><text x="112" y="294" fill="#ef6a63" font-size="17" font-weight="700">pagerduty-devops</text><text x="112" y="320" fill="#aaa39c" font-size="16">environment = production</text><path d="M418 173H612" stroke="#66bb6a" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#rt2)"/><text x="515" y="162" fill="#66bb6a" font-size="16" text-anchor="middle">continue 가 켜져 있어</text><text x="515" y="200" fill="#66bb6a" font-size="16" text-anchor="middle">같은 층 형제도 계속 봅니다</text><rect x="470" y="252" width="682" height="46" rx="8" fill="#141f16" stroke="#66bb6a" stroke-width="2"/><text x="494" y="281" fill="#e8e4df" font-size="16">{team=devops, <tspan fill="#66bb6a">env=production</tspan>} → 3층까지 내려감 · 발송은 <tspan fill="#66bb6a" font-weight="700">pagerduty-devops 와 default</tspan></text><rect x="470" y="306" width="682" height="46" rx="8" fill="#241615" stroke="#ef6a63" stroke-width="2"/><text x="494" y="335" fill="#e8e4df" font-size="16">{team=devops, <tspan fill="#ef6a63">env=staging</tspan>} → 3층에 안 걸림 · <tspan fill="#ef6a63" font-weight="700">2층으로 되돌아와</tspan> slack-devops 로</text></svg><p class="note">첫째 줄에서 <strong>slack-devops 는 지나가기만 합니다</strong> : 자식에 걸려 더 내려갔으니 경유지입니다. 지나간 노드가 곧 발송지는 아닙니다.<br><code>mute_time_intervals</code>는 그 시간대에 <strong>발송만</strong> 멈추고 탐색은 그대로입니다. <span class="bad">최상위에는 못 걸어</span> 바로 아래에 매처 없는 라우트를 두고 겁니다.</p>','05-01 §2 라우팅 · §3 서브라우트와 continue · §5 시간 구간','라우팅'],
['알림','ch5','<h2>억제는 원인이 결과 알림을 가립니다</h2><div class="intro-block"><p class="lead">원인 알림이 살아 있는 동안 <span class="accent">결과 알림의 통지를 막습니다.</span></p></div><p class="sub">DB가 죽으면 API 오류도 함께 터집니다. 당직자가 볼 것은 <strong>원인 하나</strong>입니다.</p><div class="grid2"><div><code class="big-code">inhibit_rules:\n  - source_matchers:\n      [alertname="DBDown"]\n    target_matchers:\n      [alertname="APIHighError"]\n    equal: [cluster, service]</code></div><div><table class="compare"><tr><th>필드</th><th>뜻</th></tr><tr><td><code>source_matchers</code></td><td class="bad">가리는 쪽 — 원인</td></tr><tr><td><code>target_matchers</code></td><td class="muted">가려지는 쪽 — 결과</td></tr><tr><td><code>equal</code></td><td class="accent">이 라벨 값이 같을 때만</td></tr></table><p class="note"><code>equal</code>이 없으면 <span class="bad">다른 클러스터의 장애까지 가려집니다.</span></p></div></div><p class="callout">가려진 알림도 Prometheus에서는 <span class="accent">여전히 firing</span>입니다. 통지만 막힐 뿐입니다.</p>','05-01 §6 리시버와 억제 규칙','억제'],
['알림','ch5','<h2><code>promtool test rules</code>로 알림을 테스트합니다</h2><div class="intro-block"><p class="lead">알림도 코드입니다. <span class="accent">기대대로 발화하는지</span> 테스트할 수 있습니다.</p></div><p class="sub">알림은 Prometheus 안에서 정의·평가되므로 <code>amtool</code>이 아니라 <strong><code>promtool</code></strong>을 씁니다.</p><code class="big-code">promtool check rules rule.yaml   문법만 검사\npromtool test rules unit.yaml    기대대로 발화하는지 검사</code><div class="grid2"><div class="card"><h3>왜 <code>amtool</code>이 아닌가</h3><p>알림은 <span class="accent">Prometheus 안에서</span> 정의되고 평가되기 때문입니다. amtool은 Alertmanager 쪽 검증입니다.</p></div><div class="card"><h3>무엇을 단언하나</h3><p>시계열을 지어 넣고 "<strong>몇 분에</strong> 무엇이 <strong>어떤 라벨로</strong> 발화해야 하는지"를 적습니다.</p></div></div><p class="callout">사고 시간대에 쿼리를 돌려 보는 방식은 유효하지만, <span class="bad">룰을 손본 뒤에도 계속 동작하리라는 보장은 주지 못합니다.</span> 알림도 코드입니다.</p>','05-02 §4 알림 룰 단위 테스트','룰 테스트'],
['알림','ch5','<h2>Alertmanager 앞에 로드밸런서를 두지 마십시오</h2><div class="intro-block"><p class="lead">가십은 <span class="accent">일부만</span> 공유합니다. 그래서 앞에 로드밸런서를 두면 <span class="bad">알림이 유실됩니다.</span></p></div><p class="sub">Prometheus가 <strong>모든 인스턴스에 같은 알림을 직접</strong> 보내야 합니다.</p><svg class="viz" style="width:100%;height:274px" viewBox="-4 -4 1160 276" role="img"><title>Alertmanager HA 구성 비교</title><desc>로드밸런서를 두면 한 인스턴스만 알림을 받아 그 인스턴스가 죽을 때 알림이 사라지고, 모든 인스턴스에 직접 보내면 남은 인스턴스가 대신 보냅니다.</desc><defs><marker id="l1" markerWidth="7" markerHeight="7" refX="6.5" refY="2.4" orient="auto"><path d="M0 0L7 2.4L0 4.8z" fill="#ef6a63"/></marker><marker id="l2" markerWidth="7" markerHeight="7" refX="6.5" refY="2.4" orient="auto"><path d="M0 0L7 2.4L0 4.8z" fill="#66bb6a"/></marker></defs><text x="8" y="22" fill="#ef6a63" font-size="17" font-weight="700">✗ 로드밸런서를 두면</text><rect x="8" y="34" width="548" height="196" rx="10" fill="#241615" stroke="#ef6a63" stroke-width="2"/><rect x="28" y="56" width="120" height="52" rx="8" fill="#1a1a1a" stroke="#72a7d8" stroke-width="2"/><text x="88" y="88" fill="#72a7d8" font-size="16" text-anchor="middle">Prometheus</text><path d="M148 82H196" stroke="#ef6a63" stroke-width="3" marker-end="url(#l1)"/><rect x="206" y="56" width="96" height="52" rx="8" fill="#1a1a1a" stroke="#ef6a63" stroke-width="2"/><text x="254" y="88" fill="#ef6a63" font-size="16" text-anchor="middle">LB</text><path d="M302 82H350" stroke="#ef6a63" stroke-width="3" marker-end="url(#l1)"/><rect x="360" y="56" width="168" height="52" rx="8" fill="#1a1a1a" stroke="#aaa39c" stroke-width="2"/><text x="444" y="80" fill="#e8e4df" font-size="16" text-anchor="middle">AM-1 만 받음</text><text x="444" y="100" fill="#ef6a63" font-size="16" text-anchor="middle">× 죽으면</text><text x="28" y="148" fill="#e8e4df" font-size="16">AM-2 · AM-3 은 그 알림이 <tspan fill="#ef6a63" font-weight="700">있었는지도 모릅니다.</tspan></text><text x="28" y="176" fill="#aaa39c" font-size="16">가십은 "이미 보냈는지"만 나누고 <tspan fill="#ef6a63">"무엇을 받았는지"는 나누지 않기</tspan> 때문입니다.</text><text x="28" y="208" fill="#ef6a63" font-size="16" font-weight="700">→ 알림이 그대로 사라집니다.</text><text x="604" y="22" fill="#66bb6a" font-size="17" font-weight="700">O 모든 인스턴스에 직접</text><rect x="604" y="34" width="548" height="196" rx="10" fill="#141f16" stroke="#66bb6a" stroke-width="2"/><rect x="624" y="56" width="120" height="52" rx="8" fill="#1a1a1a" stroke="#72a7d8" stroke-width="2"/><text x="684" y="88" fill="#72a7d8" font-size="16" text-anchor="middle">Prometheus</text><path d="M744 66H812" stroke="#66bb6a" stroke-width="3" marker-end="url(#l2)"/><path d="M744 82H812" stroke="#66bb6a" stroke-width="3" marker-end="url(#l2)"/><path d="M744 98H812" stroke="#66bb6a" stroke-width="3" marker-end="url(#l2)"/><rect x="822" y="46" width="150" height="30" rx="6" fill="#1a1a1a" stroke="#66bb6a" stroke-width="2"/><text x="897" y="67" fill="#e8e4df" font-size="16" text-anchor="middle">AM-1</text><rect x="822" y="82" width="150" height="30" rx="6" fill="#241615" stroke="#ef6a63" stroke-width="2"/><text x="897" y="103" fill="#ef6a63" font-size="16" text-anchor="middle">AM-2 × 죽음</text><rect x="822" y="118" width="150" height="30" rx="6" fill="#1a1a1a" stroke="#66bb6a" stroke-width="2"/><text x="897" y="139" fill="#e8e4df" font-size="16" text-anchor="middle">AM-3</text><text x="990" y="74" fill="#66bb6a" font-size="16">셋 다 같은</text><text x="990" y="96" fill="#66bb6a" font-size="16">알림을 가짐</text><text x="990" y="126" fill="#aaa39c" font-size="16">--cluster.peer</text><text x="990" y="146" fill="#aaa39c" font-size="16">로 묶인 클러스터</text><text x="624" y="176" fill="#e8e4df" font-size="16">하나가 죽어도 <tspan fill="#66bb6a" font-weight="700">남은 둘이 대신 보냅니다.</tspan></text><text x="624" y="208" fill="#aaa39c" font-size="16">가십이 "이미 보냄"을 나눠 <tspan fill="#66bb6a">중복 통지는 막습니다.</tspan></text></svg><p class="note">인스턴스끼리는 <code>--cluster.peer</code>로 <strong>서로를 피어로 지정해 클러스터를 이룹니다.</strong> 합의 알고리듬을 쓰지 않아 정족수가 필요 없고, 한 대만 살아 있어도 알림은 계속 나갑니다. 보통 2~3대를 서로 다른 AZ에 둡니다.</p>','05-01 §9 HA — 로드밸런서를 앞에 두지 마십시오','HA'],
['종합','synthesis','<h2>한 번의 스크레이프가 끝까지 가는 길</h2><div class="intro-block"><p class="lead">오늘 본 <span class="accent">네 구간</span>이 각각 이 흐름의 한 토막이었습니다.</p></div><p class="sub">맨 앞에서 본 다섯 동사가 여기서 여섯 단계로 완성됩니다.</p><svg class="viz" style="width:100%;height:405px" viewBox="-4 -4 1160 408" role="img"><title>한 번의 스크레이프가 끝까지 가는 길</title><desc>수집 네 단계를 거쳐 저장되고, 조회로 읽히며, 규칙 평가를 거쳐 알림으로 나갑니다.</desc><defs><marker id="w1" markerWidth="7" markerHeight="7" refX="6.5" refY="2.4" orient="auto"><path d="M0 0L7 2.4L0 4.8z" fill="#d4a853"/></marker></defs><text x="8" y="24" fill="#d4a853" font-size="18" font-weight="700">수집</text><rect x="8" y="38" width="256" height="80" rx="10" fill="#1a1a1a" stroke="#72a7d8" stroke-width="3"/><text x="136" y="70" fill="#72a7d8" font-size="17" font-weight="700" text-anchor="middle">① 서비스 디스커버리</text><text x="136" y="98" fill="#e8e4df" font-size="16" text-anchor="middle">후보 주소를 받는다</text><path d="M264 78H306" stroke="#d4a853" stroke-width="3" marker-end="url(#w1)"/><rect x="316" y="38" width="256" height="80" rx="10" fill="#1a1a1a" stroke="#d4a853" stroke-width="3"/><text x="444" y="70" fill="#d4a853" font-size="17" font-weight="700" text-anchor="middle">② relabel_configs</text><text x="444" y="98" fill="#e8e4df" font-size="16" text-anchor="middle">긁을 대상을 고른다</text><path d="M572 78H614" stroke="#d4a853" stroke-width="3" marker-end="url(#w1)"/><rect x="624" y="38" width="256" height="80" rx="10" fill="#d4a853"/><text x="752" y="70" fill="#0d0d0d" font-size="17" font-weight="700" text-anchor="middle">③ Exporter collector</text><text x="752" y="98" fill="#0d0d0d" font-size="16" text-anchor="middle">값을 만든다</text><path d="M880 78H922" stroke="#d4a853" stroke-width="3" marker-end="url(#w1)"/><rect x="932" y="38" width="220" height="80" rx="10" fill="#1a1a1a" stroke="#ef6a63" stroke-width="3"/><text x="1042" y="70" fill="#ef6a63" font-size="17" font-weight="700" text-anchor="middle">④ metric_relabel</text><text x="1042" y="98" fill="#e8e4df" font-size="16" text-anchor="middle">저장할 것을 고른다</text><path d="M1042 118V152H136V186" fill="none" stroke="#d4a853" stroke-width="3" marker-end="url(#w1)"/><text x="8" y="214" fill="#66bb6a" font-size="18" font-weight="700">저장</text><rect x="8" y="226" width="256" height="80" rx="10" fill="#1a1a1a" stroke="#66bb6a" stroke-width="3"/><text x="136" y="258" fill="#66bb6a" font-size="17" font-weight="700" text-anchor="middle">⑤ TSDB</text><text x="136" y="286" fill="#e8e4df" font-size="16" text-anchor="middle">WAL → head → 블록</text><path d="M264 266H306" stroke="#d4a853" stroke-width="3" marker-end="url(#w1)"/><text x="316" y="214" fill="#72a7d8" font-size="18" font-weight="700">조회</text><rect x="316" y="226" width="256" height="80" rx="10" fill="#1a1a1a" stroke="#72a7d8" stroke-width="3"/><text x="444" y="258" fill="#72a7d8" font-size="17" font-weight="700" text-anchor="middle">PromQL 이 읽는다</text><text x="444" y="286" fill="#e8e4df" font-size="16" text-anchor="middle">인덱스 → chunk</text><path d="M572 266H614" stroke="#d4a853" stroke-width="3" marker-end="url(#w1)"/><text x="624" y="214" fill="#ef6a63" font-size="18" font-weight="700">알림</text><rect x="624" y="226" width="256" height="80" rx="10" fill="#1a1a1a" stroke="#ef6a63" stroke-width="3"/><text x="752" y="258" fill="#ef6a63" font-size="17" font-weight="700" text-anchor="middle">⑥ 규칙 평가</text><text x="752" y="286" fill="#e8e4df" font-size="16" text-anchor="middle">pending → firing</text><path d="M880 266H922" stroke="#d4a853" stroke-width="3" marker-end="url(#w1)"/><rect x="932" y="226" width="220" height="80" rx="10" fill="#1a1a1a" stroke="#66bb6a" stroke-width="3"/><text x="1042" y="258" fill="#66bb6a" font-size="17" font-weight="700" text-anchor="middle">Alertmanager</text><text x="1042" y="286" fill="#e8e4df" font-size="16" text-anchor="middle">묶어서 사람에게</text><path d="M8 336H1152" stroke="#2a2520" stroke-width="1"/><text x="8" y="366" fill="#aaa39c" font-size="17">같은 문법(relabeling)이 <tspan fill="#d4a853" font-weight="700">②와 ④ 두 자리</tspan>에 놓입니다. 거기서 거르는 것이 각각 <tspan fill="#d4a853" font-weight="700">타깃</tspan>과 <tspan fill="#ef6a63" font-weight="700">시계열</tspan>로 갈립니다.</text><text x="8" y="394" fill="#aaa39c" font-size="17">어느 칸에서 값이 사라졌는지가 곧 <tspan fill="#66bb6a" font-weight="700">어디를 고쳐야 하는지</tspan>입니다.</text></svg>','수집·저장·조회·알림 종합','통합 지도'],
['종합','synthesis','<h2>마지막 5문장 회상</h2><div class="intro-block"><p class="lead">보지 않고 설명할 수 있다면 <span class="accent">네 주제의 뼈대</span>를 잡은 것입니다.</p></div><p class="sub">다섯 문장으로 압축했습니다.</p><ol><li>라벨 <strong>전체</strong>가 시계열 하나를 정합니다.</li><li>샘플은 <strong>WAL → head → block</strong>으로 이동하고, 블록은 불변입니다.</li><li>relabeling은 타깃과 시계열을 <strong>서로 다른 위치</strong>에서 거릅니다.</li><li>Prometheus의 <strong>firing</strong>과 Alertmanager의 <strong>억제</strong>는 다른 상태입니다.</li><li>Node Exporter timeout은 <strong>가장 느린 collector</strong>의 duration부터 봅니다.</li></ol><p class="question">보지 않고 설명할 수 있다면 네 장의 뼈대를 잡은 것입니다.</p><p class="answer">다음은 한 대를 넘어서는 이야기입니다 — 06장 샤딩·HA · 07장 카디널리티 디버깅 · 09장 remote write · 10장 Thanos.</p>','네 주제 핵심 요약','최종 회상'],
];
const deck=document.querySelector('#deck');S.forEach((s,i)=>{const el=document.createElement('section');el.className='slide '+(s[5]||'');el.dataset.kicker=s[0];el.dataset.section=s[1];el.dataset.page=String(i+1).padStart(2,'0')+' / '+S.length;el.innerHTML=s[2]+'<div class="footer"><span>출처 섹션: '+s[3]+'</span><span>'+s[4]+'</span></div>';deck.append(el)});
const slides=[...document.querySelectorAll('.slide')];let index=0;function show(i){index=Math.max(0,Math.min(slides.length-1,i));slides[index].scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'center'})}document.querySelector('#prev').onclick=()=>show(index-1);document.querySelector('#next').onclick=()=>show(index+1);document.querySelector('#print').onclick=()=>print();addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(index+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(index-1)}if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1)});const observer=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)index=slides.indexOf(e.target)}),{threshold:.6});slides.forEach(s=>observer.observe(s));
</script></body></html>
