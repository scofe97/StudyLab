<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Prometheus와 Alertmanager의 알림 상태를 분리해 보는 인터랙티브 학습 자료"><title>알림 수명주기</title>
<style>
:root{--bg:#0d0d0d;--panel:#1a1a1a;--text:#e8e4df;--muted:#aaa39c;--line:#2a2520;--accent:#d4a853;--ok:#66bb6a;--bad:#ef6a63;--blue:#72a7d8}*{box-sizing:border-box}body{max-width:1100px;margin:auto;padding:30px 20px 48px;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;line-height:1.55}h1{font-size:clamp(1.8rem,5vw,2.7rem);margin:.2rem 0}h2{font-size:1.2rem;margin:0 0 12px}.eyebrow{color:var(--accent);font:700 .8rem ui-monospace,monospace;letter-spacing:.09em}.intro,.question{color:var(--muted)}.panel{margin-top:18px;padding:20px;border:1px solid var(--line);border-radius:12px;background:#111}.scenarios,.controls{display:flex;flex-wrap:wrap;gap:9px}button{min-height:42px;padding:9px 15px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--text);font:inherit;cursor:pointer}button:hover,button:focus-visible{border-color:var(--accent);outline:none}button[aria-pressed=true]{border-color:var(--accent);background:#2a2114;color:#f3d697}button:disabled{opacity:.4}.pipeline-wrap{overflow-x:auto;padding:8px 0 16px}.pipeline{display:flex;align-items:flex-start;min-width:max-content}.step{display:grid;justify-items:center;width:132px;padding:6px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:.84rem}.dot{display:grid;place-items:center;width:40px;height:40px;margin-bottom:7px;border:2px solid var(--line);border-radius:50%;background:var(--panel);font-family:ui-monospace,monospace}.step.done .dot{border-color:var(--ok)}.step.current{color:var(--accent)}.step.current .dot{border-color:var(--accent);background:#2a2114}.connector{width:34px;height:2px;margin-top:25px;background:var(--line)}.connector.done{background:var(--ok)}.counter{margin-left:auto;color:var(--muted);font-family:ui-monospace,monospace}.machines{display:grid;grid-template-columns:1fr 1fr;gap:16px}.machine{padding:17px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}.machine h3{margin:0 0 12px;font-size:1rem}.prom h3{color:var(--blue)}.am h3{color:var(--ok)}.machine dl{display:grid;grid-template-columns:120px 1fr;gap:8px;margin:0}.machine dt{color:var(--muted);font-size:.82rem}.machine dd{margin:0}.terminal{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:8px}.terminal.ok{border-color:var(--ok)}.terminal.bad{border-color:var(--bad)}kbd{padding:2px 6px;border:1px solid var(--line);border-radius:4px;background:var(--panel)}.help{font-size:.85rem;color:var(--muted)}
@media(max-width:620px){body{padding:18px 12px}.panel{padding:15px}.machines{grid-template-columns:1fr}.counter{width:100%;margin:0}.step{width:112px}.help{display:none}}@media(max-width:390px){.scenarios button,.controls button{flex:1 1 auto}.machine dl{grid-template-columns:96px 1fr}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body>
<noscript><section class="panel"><h2>JavaScript 없이 보는 핵심</h2><p><strong>일시적 이상:</strong> Prometheus가 pending에 들어가지만 <code>for</code> 전에 회복해 Alertmanager로 보내지 않습니다.</p><p><strong>지속 이상:</strong> <code>for</code>를 채워 firing이 되고 Alertmanager가 그룹 대기 뒤 통지합니다.</p><p><strong>의존성 억제:</strong> 상위 장애와 하위 증상 모두 Prometheus에서는 firing이지만 Alertmanager가 하위 통지만 억제합니다.</p></section></noscript>
<main><header><p class="eyebrow">INTERACTIVE 2 · CHAPTER 5</p><h1>알림 수명주기</h1><p class="intro">왼쪽의 Prometheus 규칙 상태와 오른쪽의 Alertmanager 통지 상태를 섞지 않고 비교합니다. 자동 재생은 꺼져 있습니다.</p></header>
<section class="panel" aria-labelledby="scenario-h"><h2 id="scenario-h">1. 시나리오 선택</h2><div id="scenarios" class="scenarios" aria-label="시나리오"></div><p id="question" class="question"></p></section>
<section class="panel" aria-labelledby="flow-h"><h2 id="flow-h">2. 단계 이동</h2><div class="pipeline-wrap"><div id="pipeline" class="pipeline"></div></div><div class="controls" aria-label="재생 조작"><button id="previous" type="button">이전</button><button id="play" type="button" aria-pressed="false">재생</button><button id="next" type="button">다음</button><span id="counter" class="counter" aria-live="polite"></span></div><p class="help"><kbd>←</kbd>/<kbd>→</kbd> 단계 이동 · <kbd>Space</kbd> 재생/일시 정지 · <kbd>1</kbd>~<kbd>3</kbd> 시나리오</p></section>
<section class="panel" aria-labelledby="explain-h"><h2 id="explain-h">3. 현재 단계 설명</h2><p id="narration" aria-live="polite"></p></section>
<section class="panel" aria-labelledby="state-h"><h2 id="state-h">4. 분리된 상태</h2><div class="machines"><article class="machine prom"><h3>Prometheus · 규칙 평가</h3><dl id="prom-state"></dl></article><article class="machine am"><h3>Alertmanager · 통지 처리</h3><dl id="am-state"></dl></article></div><p id="terminal" class="terminal" aria-live="polite"></p></section></main>
<script>
const scenarios=[
{name:'일시적 이상',question:'조건이 for 기간 전에 정상으로 돌아오면 Alertmanager가 알림을 받을까요?',terminal:'정상 종료: Prometheus는 inactive로 돌아왔고 Alertmanager는 알림을 한 번도 받지 않았습니다.',tone:'ok',steps:[
{label:'정상',text:'규칙 조건이 거짓입니다.',p:[['규칙 상태','inactive'],['조건','거짓'],['for 경과','0분']],a:[['수신','없음'],['통지','없음'],['억제','해당 없음']]},
{label:'이상 감지',text:'조건이 참이 되어 pending이 시작됩니다. 아직 firing이 아닙니다.',p:[['규칙 상태','pending'],['조건','참'],['for 경과','0 / 10분']],a:[['수신','없음'],['통지','없음'],['이유','firing 전']]},
{label:'잠깐 지속',text:'이상은 이어지지만 for 10분을 채우지 못했습니다.',p:[['규칙 상태','pending'],['조건','참'],['for 경과','6 / 10분']],a:[['수신','없음'],['그룹','없음'],['통지','없음']]},
{label:'회복',text:'조건이 거짓으로 돌아와 pending 시간이 초기화됩니다.',p:[['규칙 상태','inactive'],['조건','거짓'],['for 경과','초기화']],a:[['수신','없음'],['통지','없음'],['최종','조용히 종료']]}
]},
{name:'지속 이상',question:'for를 채운 뒤에도 사람에게 곧바로 통지되지 않을 수 있는 이유는 무엇일까요?',terminal:'경고 종료: Prometheus는 firing이고 Alertmanager는 group_wait 뒤 수신자에게 통지했습니다.',tone:'bad',steps:[
{label:'정상',text:'규칙 조건이 거짓이고 두 시스템 모두 대기 중입니다.',p:[['규칙 상태','inactive'],['조건','거짓'],['for 경과','0분']],a:[['수신','없음'],['그룹','없음'],['통지','없음']]},
{label:'pending',text:'조건이 참이 되어 for 시간을 세기 시작합니다.',p:[['규칙 상태','pending'],['조건','참'],['for 경과','0 / 10분']],a:[['수신','없음'],['통지','없음'],['이유','firing 전']]},
{label:'firing',text:'10분을 채워 Prometheus 상태가 firing이 되고 Alertmanager로 전송됩니다.',p:[['규칙 상태','firing'],['조건','참'],['for 경과','10분 충족']],a:[['수신','1건'],['그룹','group_wait'],['통지','아직']]},
{label:'그룹 대기',text:'Alertmanager는 같은 그룹의 알림을 모으기 위해 group_wait 동안 기다립니다.',p:[['규칙 상태','firing'],['전송','계속 갱신'],['조건','참']],a:[['수신','활성'],['그룹','대기 중'],['통지','보류']]},
{label:'통지',text:'group_wait가 끝나 라우트가 고른 수신자에게 묶어서 보냅니다.',p:[['규칙 상태','firing'],['조건','참'],['전송','계속']],a:[['라우트','on-call'],['억제','없음'],['통지','발송됨']]}
]},
{name:'의존성 억제',question:'상위 장애가 하위 증상을 억제해도 하위 규칙은 firing일까요?',terminal:'억제 종료: DBDown과 APIHighError는 모두 Prometheus에서 firing입니다. Alertmanager는 DBDown만 통지하고 APIHighError 통지는 억제했습니다.',tone:'bad',steps:[
{label:'두 조건',text:'데이터베이스 장애가 API 오류를 일으켜 두 규칙 조건이 모두 참입니다.',p:[['DBDown','pending'],['APIHighError','pending'],['for','진행 중']],a:[['수신','없음'],['억제','평가 전'],['통지','없음']]},
{label:'둘 다 firing',text:'두 규칙 모두 for를 채웠습니다. Prometheus에는 둘 다 firing입니다.',p:[['DBDown','firing'],['APIHighError','firing'],['전송','2건']],a:[['수신','2건'],['억제','평가 대기'],['통지','아직']]},
{label:'억제 매칭',text:'DBDown이 source, APIHighError가 target으로 일치하고 equal 라벨의 값도 같습니다.',p:[['DBDown','firing'],['APIHighError','firing'],['cluster','prod-a']],a:[['source','DBDown'],['target','APIHighError'],['equal','cluster 일치']]},
{label:'상위만 통지',text:'Alertmanager는 원인인 DBDown을 통지하고 하위 증상 통지는 억제합니다.',p:[['DBDown','firing'],['APIHighError','firing'],['규칙 상태','변화 없음']],a:[['DBDown','통지'],['APIHighError','억제'],['수신자','상위 1건']]}
]}
];let si=0,step=0,timer=null;const reduce=matchMedia('(prefers-reduced-motion:reduce)');const $=q=>document.querySelector(q);function current(){return scenarios[si]}function stop(){clearInterval(timer);timer=null;$('#play').textContent='재생';$('#play').setAttribute('aria-pressed','false')}function rows(items){return items.flatMap(([k,v])=>{const dt=document.createElement('dt');dt.textContent=k;const dd=document.createElement('dd');dd.textContent=v;return[dt,dd]})}
function render(){const sc=current();$('#scenarios').replaceChildren(...scenarios.map((x,i)=>{const b=document.createElement('button');b.type='button';b.textContent=x.name;b.setAttribute('aria-pressed',String(i===si));b.onclick=()=>{si=i;step=0;stop();render()};return b}));$('#question').textContent='관찰 질문: '+sc.question;$('#pipeline').replaceChildren(...sc.steps.flatMap((x,i)=>{const b=document.createElement('button');b.type='button';b.className='step'+(i<step?' done':'')+(i===step?' current':'');b.setAttribute('aria-pressed',String(i===step));if(i===step)b.setAttribute('aria-current','step');b.innerHTML='<span class="dot">'+(i+1)+'</span><span>'+x.label+'</span>';b.onclick=()=>{step=i;stop();render()};if(i===sc.steps.length-1)return[b];const c=document.createElement('span');c.className='connector'+(i<step?' done':'');c.setAttribute('aria-hidden','true');return[b,c]}));const x=sc.steps[step];$('#narration').textContent=x.text;$('#prom-state').replaceChildren(...rows(x.p));$('#am-state').replaceChildren(...rows(x.a));$('#counter').textContent=(step+1)+' / '+sc.steps.length+' · '+sc.name;$('#previous').disabled=step===0;$('#next').disabled=step===sc.steps.length-1;const end=step===sc.steps.length-1;$('#terminal').textContent=end?sc.terminal:'종료 상태는 마지막 단계에서 확인합니다.';$('#terminal').className='terminal '+(end?sc.tone:'')}
$('#previous').onclick=()=>{step=Math.max(0,step-1);stop();render()};$('#next').onclick=()=>{step=Math.min(current().steps.length-1,step+1);stop();render()};$('#play').onclick=()=>{if(timer){stop();return}if(reduce.matches){step=Math.min(current().steps.length-1,step+1);render();return}if(step===current().steps.length-1)step=0;$('#play').textContent='일시 정지';$('#play').setAttribute('aria-pressed','true');timer=setInterval(()=>{if(step===current().steps.length-1){stop();return}step++;render()},1500)};addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON')return;if(e.key==='ArrowLeft')$('#previous').click();if(e.key==='ArrowRight')$('#next').click();if(e.key===' '){e.preventDefault();$('#play').click()}if(['1','2','3'].includes(e.key)){si=Number(e.key)-1;step=0;stop();render()}});render();
</script></body></html>
